'use strict';
const DATA={"groups":[{"id":"start","title":"开始使用"},{"id":"workspace","title":"工作台"},{"id":"methods","title":"光谱方法"},{"id":"analysis","title":"分析测试"},{"id":"data","title":"数据处理"},{"id":"tools","title":"工具"},{"id":"system","title":"系统管理"},{"id":"help","title":"帮助与故障排查"},{"id":"reference","title":"文件与术语参考"}],"topics":[{"id":"welcome","group":"start","title":"手册首页","lead":"按任务学习，按菜单查阅。","related":["first-run","daily","navigation","files"],"html":"\u003cp>这份手册面向 GeoSpectrum Windows 桌面版，帮助您从启动软件走到采集、分析、质控和报告输出。\u003c/p>\n\u003ch2>从这里开始\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>第一次使用：\u003c/strong>先阅读\u003ca href=\"#launch\">启动软件\u003c/a>与\u003ca href=\"#login\">创建管理员和登录\u003c/a>，再按\u003ca href=\"#first-run\">首次使用路线\u003c/a>建立工作环境。\u003c/li>\n\u003cli>\u003cstrong>已经有方法：\u003c/strong>按\u003ca href=\"#daily\">日常分析流程\u003c/a>执行样品采集和结果输出。\u003c/li>\n\u003cli>\u003cstrong>按菜单查阅：\u003c/strong>展开左侧目录，七组业务菜单与当前软件对应。\u003c/li>\n\u003cli>\u003cstrong>遇到问题：\u003c/strong>输入“菜单灰色”“标准曲线”“报告”等关键词搜索，或进入\u003ca href=\"#faq-menu\">故障排查\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2>如何浏览\u003c/h2>\n\u003cp>左侧目录支持逐级展开、收起，点击主题后在右侧阅读。正文中的蓝色文字可以跳到相关说明。页面底部提供“上一页 / 下一页”，上方提供阅读历史的“后退 / 前进”。\u003c/p>\n\u003cp>每篇说明尽量按“从哪里进入 → 如何操作 → 完成后检查”的顺序编排。搜索覆盖标题和正文；按 \u003cstrong>/\u003c/strong> 可将焦点移到搜索框。字号按钮调整阅读大小，“打印本页”可打印或另存为 PDF。\u003c/p>\n\u003ch2>适用范围\u003c/h2>\n\u003cp>适用于当前 GeoSpectrum Windows 内部测试版。各主题说明软件操作。真实转角、汞灯光谱与整机联动仍需现场验证。\u003c/p>\n\u003cp>本手册是独立的离线 HTML 文件，双击后在浏览器中阅读；不需要登录软件、启动服务或联网。它借鉴旧 DIRECT.CHM 的层级目录与主题跳转形式，内容按当前软件重新组织。\u003c/p>\n"},{"id":"launch","group":"start","title":"启动软件与正常退出","lead":"只双击主程序，配套后端由软件管理。","related":["login","faq-start","files"],"html":"\u003cp>项目主文件夹中需要同时保留以下两个文件：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>GeoSpectrum.exe\u003c/code>：桌面前端和主程序。\u003c/li>\n\u003cli>\u003ccode>geospectrum-backend.exe\u003c/code>：本地后端服务，由主程序自动启动。\u003c/li>\n\u003c/ul>\n\u003cp>两个文件必须放在同一文件夹中，不要单独移动、改名或只复制其中一个。正常使用时只双击 \u003ccode>GeoSpectrum.exe\u003c/code>，不要单独双击后端文件。\u003c/p>\n\u003cp>软件运行数据默认保存在 Windows 当前用户数据目录 \u003ccode>%LOCALAPPDATA%\\cn.geospectrum.desktop\u003c/code>，不会保存在这两个 EXE 旁边。关闭主窗口时，主程序会自动停止本次启动的后端进程。\u003c/p>\n\u003cp>当前版本是未签名内部测试版。Windows 若显示安全提示，请先确认文件来自本项目且哈希未变化，再选择继续运行。真实设备使用已标定的蓝牙电机切角，汞灯由仪器自动开启。现场到位精度、光源和采集效果仍待实机验收。\u003c/p>\n\u003cp>新版已接入旧设备的 COM 串口、激发采集与结束流程，可用于调试对中、色散、蒸发、样品及独立预热。真实设备按已配置的角度映射切换工作转角。\u003c/p>\n\u003cp>连接准备：在“设备调试 → 设备参数”直接选择仪器实际COM口，核对460800或921600波特率与CCD安装插槽并保存。通讯口旁可勾选“模拟设备（用于测试）”，取消后恢复此前的真实COM口和参数；不再通过设备档案下拉框选择。点击通讯口旁的“连接测试”，新版按旧版执行一次短采集，收到有效CCD帧并完成收尾后才通过；只打开串口不算仪器连通，测试不生成正式样品谱，结束后释放串口。原模拟档案保留。\u003c/p>\n\u003cp>蓝牙串口连接：进入“工具 → 设备连接”，左侧是Windows实际已连接／已配对的蓝牙设备及状态，右侧仅显示该设备的传出COM口。选定后“保存绑定”，再连接。无串口服务的设备不可绑定；配对、添加或更改COM号在“打开 Windows 蓝牙设置 → 更多蓝牙设置 → COM端口”中完成，之后回到软件“刷新设备与端口”。软件不把本机传入COM口或其他设备的端口当作可绑定项。波特率与CCD规格沿用设备参数；串口打开与仪器已响应分开显示，模拟测试在设备参数中勾选。\u003c/p>\n\u003cp>选择真实档案后，适用的摄谱任务会在进入工作台前检查连接。检查失败时保留档案和草稿，并提示原因。已有结果仍可查看。调试对中可直接打开，点击「连接诊断」验证 CCD 响应，通过后即可切换转角，点击「开始」观察实时谱图。通信异常后，按状态栏提示停止或重新连接。\u003c/p>\n\u003cp>真实参数：预激0–10秒、燃烧／暗帧周期1–2秒，以0.25秒递增；采样周期须与燃烧周期一致。旧固件即使预激填0也按至少2秒准备，随后才开始燃烧采样。燃烧帧、暗帧和一帧状态转换的数量合计不能超过255；转换帧不作为暗帧保存。真实采集中使用“停止”，旧协议没有可确认的暂停／继续命令。缺帧、帧头错误和端口故障会中止任务并保留已收到的有效帧，不会转用模拟数据；若结束指令响应无法确认，界面会明确提示检查仪器状态。模拟器的参数、暂停／继续及原工作方式保持。\u003c/p>\n\u003cp>正常关窗时，桌面程序会先请求后端结束真实采集并保存已经收到的完整帧，再结束后端。停止失败或本地服务无法确认时保留窗口并提示检查仪器。软件收到完整结束响应不等同于物理安全认证；断线、意外断电和实际仪器联动仍须现场验收。\u003c/p>\n\u003ch2>启动步骤\u003c/h2>\n\u003col>\n\u003cli>打开项目主文件夹。\u003c/li>\n\u003cli>双击 \u003ccode>GeoSpectrum.exe\u003c/code>。\u003c/li>\n\u003cli>等待窗口出现。主程序会自动选择一个空闲的本机端口并启动 \u003ccode>geospectrum-backend.exe\u003c/code>。\u003c/li>\n\u003cli>不要关闭或结束后端进程；它由主窗口统一管理。\u003c/li>\n\u003c/ol>\n\u003ch2>正常退出\u003c/h2>\n\u003col>\n\u003cli>先停止正在运行的实时调试、采集或校准任务。\u003c/li>\n\u003cli>等待任务完成或完成安全停止。\u003c/li>\n\u003cli>点击窗口右上角关闭按钮。\u003c/li>\n\u003cli>主窗口关闭后，后端进程会自动退出。\u003c/li>\n\u003c/ol>\n"},{"id":"login","group":"start","title":"创建管理员和登录","related":["users","navigation","faq-password"],"html":"\u003ch2>首次创建管理员\u003c/h2>\n\u003cp>如果本机数据库中还没有账户，界面会显示“初始化本地管理员”。\u003c/p>\n\u003col>\n\u003cli>输入管理员用户名。\u003c/li>\n\u003cli>输入至少 8 位密码。\u003c/li>\n\u003cli>在“确认密码”中再次输入相同密码。\u003c/li>\n\u003cli>点击“创建管理员”。\u003c/li>\n\u003cli>返回登录页后，用刚创建的用户名和密码登录。\u003c/li>\n\u003c/ol>\n\u003cp>软件没有预设通用管理员密码。请妥善保存首次创建的账户信息，不要通过删除数据库的方式处理忘记密码问题。\u003c/p>\n\u003ch2>使用已有账户\u003c/h2>\n\u003col>\n\u003cli>在“登录工作台”输入现有本机用户名和密码。\u003c/li>\n\u003cli>点击“登录”。\u003c/li>\n\u003cli>如果提示“用户名或密码错误”，先检查输入法、大小写及账户是否已被停用。\u003c/li>\n\u003cli>如果页面一直显示账户状态异常，可点击“重新检查账户状态”。\u003c/li>\n\u003c/ol>\n\u003ch2>登录后检查\u003c/h2>\n\u003cp>确认工作台可以打开，顶部显示当前账户。需要切换账户时，使用顶部“退出登录”按钮；采集运行中应先完成安全停止。\u003c/p>\n"},{"id":"first-run","group":"start","title":"首次使用路线","related":["daily","standard-names","faq-report"],"html":"\u003cp>首次使用可分为四个阶段。下面每一项都可以点击打开详细步骤。\u003c/p>\n\u003ch2>1. 建立本机环境\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#login\">启动软件并登录\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#settings\">设置主题、分析参数和备份目录\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#overview\">检查本地服务与数据库\u003c/a>。\u003c/li>\n\u003cli>有旧数据时，执行\u003ca href=\"#migrate-methods\">旧方法与配置迁移\u003c/a>；没有旧数据可直接新建方法。\u003c/li>\n\u003c/ol>\n\u003ch2>2. 准备方法与样品\u003c/h2>\n\u003col>\n\u003cli>使用\u003ca href=\"#devices\">设备实时调试\u003c/a>检查模拟采集。\u003c/li>\n\u003cli>需要时建立\u003ca href=\"#dispersion\">色散校准\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#method-create\">新建方法\u003c/a>，设置\u003ca href=\"#conditions\">方法参数\u003c/a>、\u003ca href=\"#lines\">分析谱线\u003c/a>与\u003ca href=\"#standard-names\">标准点名称\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#method-publish\">预览、发布并设为当前\u003c/a>。\u003c/li>\n\u003cli>建立\u003ca href=\"#queue\">样品队列\u003c/a>，核对重复次数。\u003c/li>\n\u003c/ol>\n\u003ch2>3. 采集、分析与质控\u003c/h2>\n\u003col>\n\u003cli>为标准样和未知样分别\u003ca href=\"#capture-create\">创建采集任务\u003c/a>，并\u003ca href=\"#capture-run\">完成全部采集\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#spectra\">查看谱图\u003c/a>，检查样号、峰位和重复数据。\u003c/li>\n\u003cli>\u003ca href=\"#analysis\">定量分析与慢进\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#quality\">重复性质控\u003c/a> → \u003ca href=\"#curves\">标准曲线\u003c/a> → \u003ca href=\"#results\">合并样品结果\u003c/a>。\u003c/li>\n\u003c/ol>\n\u003ch2>4. 输出与保留记录\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#reports\">建立、预览并确认报告\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#exports\">选择输出格式并保存\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#backup\">创建在线备份并校验\u003c/a>。\u003c/li>\n\u003cli>正常关闭主窗口。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>完成标志：\u003c/strong>报告来源可追溯到方法版本、采集数据与曲线快照，输出文件可打开，备份校验通过。单独完成“分析运行”还不等于已经得到可输出的最终报告。\u003c/p>\n"},{"id":"daily","group":"start","title":"日常分析流程","related":["first-run","capture-run","reports"],"html":"\u003cp>首次设置和方法发布完成后，日常操作可以按以下顺序进行：\u003c/p>\n\u003col>\n\u003cli>启动 \u003ccode>GeoSpectrum.exe\u003c/code> 并登录。\u003c/li>\n\u003cli>在工作台确认本地服务在线、当前方法和版本正确。\u003c/li>\n\u003cli>建立或选择样品队列。\u003c/li>\n\u003cli>为标准样和未知样分别建立采集任务并完成全部重复采集。\u003c/li>\n\u003cli>在谱图查看中快速检查峰位、异常曲线和样品名称。\u003c/li>\n\u003cli>建立分析运行，完成慢进检查点。\u003c/li>\n\u003cli>完成重复质控。\u003c/li>\n\u003cli>检查标准点、重新拟合并发布每条标准曲线。\u003c/li>\n\u003cli>在样品结果中“合并并保存”。\u003c/li>\n\u003cli>建立报告、预览、确认并导出。\u003c/li>\n\u003cli>创建在线备份并正常关闭软件。\u003c/li>\n\u003c/ol>\n\u003ch2>开始前核对\u003c/h2>\n\u003cul>\n\u003cli>核对当前方法名称与版本。\u003c/li>\n\u003cli>标准样与未知样的类型、名称和重复次数正确。\u003c/li>\n\u003cli>本轮使用的数据、曲线和报告来源对应同一套方法口径。\u003c/li>\n\u003c/ul>\n\u003ch2>流程跳转\u003c/h2>\n\u003cp>\u003ca href=\"#queue\">样品队列\u003c/a> → \u003ca href=\"#capture-create\">创建采集\u003c/a> → \u003ca href=\"#capture-run\">执行采集\u003c/a> → \u003ca href=\"#analysis\">分析\u003c/a> → \u003ca href=\"#quality\">质控\u003c/a> → \u003ca href=\"#curves\">曲线\u003c/a> → \u003ca href=\"#results\">合并结果\u003c/a> → \u003ca href=\"#reports\">报告\u003c/a> → \u003ca href=\"#backup\">备份\u003c/a>。\u003c/p>\n"},{"id":"navigation","group":"workspace","title":"认识界面与菜单","entry":"左侧导航与顶部工具栏","related":["faq-menu","method-publish","users"],"html":"\u003ch2>界面分区\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>左侧导航：\u003c/strong>工作台、光谱方法、分析测试、数据处理、工具、系统管理、帮助。\u003c/li>\n\u003cli>\u003cstrong>顶部：\u003c/strong>当前方法、切换明暗主题、专注模式及账户入口。可按 Ctrl+Shift+F 切换专注模式。\u003c/li>\n\u003cli>\u003cstrong>中央工作区：\u003c/strong>所选功能的列表、参数、曲线或结果。\u003c/li>\n\u003cli>\u003cstrong>运行消息：\u003c/strong>记录操作结果、告警与错误，排查问题时优先保留原始提示。\u003c/li>\n\u003c/ul>\n\u003ch2>使用层级菜单\u003c/h2>\n\u003cp>侧栏可展开或收合为图标。选择对应分组可打开子菜单。选择子项进入对应页面或内部视图，按 Esc 或点击外部区域收起。长菜单可滚动，键盘方向键可辅助切换焦点。\u003c/p>\n\u003ch2>为什么入口不同\u003c/h2>\n\u003cp>\u003cstrong>入口不显示：\u003c/strong>当前账户没有所需权限。\u003cstrong>入口显示但不可用：\u003c/strong>通常尚未选择当前方法，或页面内还缺少必要输入。先查看禁用原因，不要反复点击。\u003c/p>\n\u003cp>“方法管理与参数”用于选择、新建或编辑方法；“分析谱线”“预览与打印”直达所选方法的对应视图。编辑所选草稿不要求先设为当前，摄谱和分析仍检查已发布当前方法。后处理和报告页允许先进入，再在页面内选取来源记录。\u003c/p>\n"},{"id":"overview","group":"workspace","title":"工作台概览","entry":"工作台 → 工作台概览","related":["messages","about","faq-service"],"html":"\u003col>\n\u003cli>登录后进入左侧“工作台”。\u003c/li>\n\u003cli>打开“工作台概览”。\u003c/li>\n\u003cli>确认本地服务显示为运行状态。\u003c/li>\n\u003cli>查看当前方法；首次使用时通常显示“请选择已发布方法”。\u003c/li>\n\u003cli>查看最近运行消息。如果出现错误，记下错误码和错误内容。\u003c/li>\n\u003cli>版本、软件激活和模块远程诊断在「帮助 → 关于软件」查看，相应功能随部署及权限开放。\u003c/li>\n\u003c/ol>\n\u003cp>左侧导航按权限显示工作台、光谱方法、分析测试、数据处理、工具、系统管理和帮助。菜单置灰时查看提示，并核对当前方法和所需输入。\u003c/p>\n\u003ch2>当前版本的显示提示\u003c/h2>\n\u003cp>检查工作台的本地服务状态、\u003ca href=\"#about\">关于软件\u003c/a>和实际任务消息。服务通道提示需要结合当前模式判断，浏览器开发和桌面运行的本机能力不同；发现异常时记录错误码及当前任务，不沿用历史截图的状态文字判断。\u003c/p>\n\u003ch2>完成后检查\u003c/h2>\n\u003cp>本地服务已连接、当前方法符合本次任务，近期消息没有未处理错误。服务离线时先按\u003ca href=\"#faq-service\">服务连接排查\u003c/a>处理。\u003c/p>\n"},{"id":"messages","group":"workspace","title":"阅读与保存运行消息","entry":"工作台 → 工作台概览；各任务的运行消息区域","related":["capture-run","faq-evidence","exports"],"html":"\u003ch2>查看消息\u003c/h2>\n\u003cp>在工作台查看运行消息；在采集、校准和分析任务中同时检查本任务的消息或轨迹。区分普通信息、警告和错误，记录发生时间、任务编号、错误码及原始错误说明。\u003c/p>\n\u003ch2>保存证据\u003c/h2>\n\u003cp>需要导出运行消息时使用界面提供的导出入口，在桌面“另存为”对话框中选择位置。保存后核对实际文件名；取消对话框不会产生文件。\u003c/p>\n\u003ch2>出错后怎么做\u003c/h2>\n\u003cp>先确认任务是否已安全停止，再根据提示修正输入、恢复任务或重新建立任务。不要只截取“失败”二字，也不要反复提交同一个无效输入。报告问题时可使用\u003ca href=\"#faq-evidence\">故障信息清单\u003c/a>。\u003c/p>\n"},{"id":"method-create","group":"methods","title":"新建与另存方法","entry":"光谱方法 → 方法管理与参数","related":["conditions","lines","method-publish"],"html":"\u003col>\n\u003cli>点击“新建方法”。\u003c/li>\n\u003cli>输入方法名称并确认。名称要简短，兼容旧格式时应控制在 GB18030 编码 20 字节以内。\u003c/li>\n\u003cli>在方法列表中选中新方法，完成配置后点击“保存”。\u003c/li>\n\u003c/ol>\n\u003ch2>复制已有方法\u003c/h2>\n\u003cp>打开参考方法并保存已完成的编辑，点击「另存为」并输入新名称。核对新方法的参数、谱线和标准点，再用于采集。\u003c/p>\n\u003ch2>下一步\u003c/h2>\n\u003cp>依次完成\u003ca href=\"#conditions\">方法参数\u003c/a>、\u003ca href=\"#lines\">分析谱线\u003c/a>、\u003ca href=\"#method-publish\">预览、保存并使用\u003c/a>。新建草稿不会自动成为当前运行方法。\u003c/p>\n"},{"id":"method-publish","group":"methods","title":"预览、保存并使用方法","entry":"光谱方法 → 方法管理与参数","related":["method-create","preview","faq-menu"],"html":"\u003col>\n\u003cli>进入“预览与打印”，核对方法条件、谱线和标准点。\u003c/li>\n\u003cli>需要时设置打印机、纸张、方向和版式；边距在高级区。份数、双面、彩色等未接通选项不显示。生成预览或导出方法参数 PDF，隐藏兼容字段在末尾“兼容参数（保留原值）”查看。\u003c/li>\n\u003cli>返回方法操作栏，确认待修正项为 0。\u003c/li>\n\u003cli>点击“保存”，系统自动生成可使用且保留历史的版本，无需另行发布。\u003c/li>\n\u003cli>从顶栏「切换当前方法」或「打开方法」打开已保存方法，作为摄谱和分析使用的当前方法。\u003c/li>\n\u003cli>顶部“当前方法”应显示方法名称和保存后的版本。\u003c/li>\n\u003c/ol>\n\u003cp>修改当前方法后，点击“保存”即更新当前引用，无需再次打开；保存其他方法不会切换当前方法。原任务、原始数据及历史结果继续引用原版本。方法页不再提供暂停/恢复；运行中的采集或分析仍使用各自任务控制。“另存为”复制当前已保存方法，需先保存未提交的修改；删除保留历史版本。\u003c/p>\n"},{"id":"print-settings","group":"methods","title":"页面与打印机设置","entry":"光谱方法 → 预览与打印 → 页面与打印机设置","related":["preview","exports"],"html":"\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>进入方法打印设置，选择要输出的方法。\u003c/li>\n\u003cli>核对打印机、纸张、方向、边距和版式。\u003c/li>\n\u003cli>保存相关设置，然后打开\u003ca href=\"#preview\">参数预览与打印\u003c/a>。\u003c/li>\n\u003cli>查看页数、中文、单位、表格边界和分页，再执行打印或 PDF 输出。\u003c/li>\n\u003c/ol>\n\u003ch2>检查要点\u003c/h2>\n\u003cp>页面参数与目标打印机纸张应一致。文件输出与实体打印是不同操作：生成 PDF 成功，不代表打印机已经出纸。需要实体打印时选择可用的 Windows 打印机，并检查打印队列。\u003c/p>\n"},{"id":"conditions","group":"methods","title":"设置方法参数","entry":"光谱方法 → 方法管理与参数","related":["lines","method-publish","interval"],"html":"\u003cp>在“方法管理与参数”中编辑所选方法：\u003c/p>\n\u003col>\n\u003cli>填写名称和说明。工作类型不再单独编辑，已有兼容值保留。\u003c/li>\n\u003cli>选择已发布色散曲线，自动带入对应 CCD 布局和已安装的 CCD，无需单独选择或显示布局。已有方法在打开或保存其他参数时保留原 CCD 配置；只有主动选择色散曲线才重新带入。新增谱线仍自动检查检测范围和安全边界。谱板与激发参数并排等高，转角在下方每行两组，“重复与误差”中的误差控制直接显示。\u003c/li>\n\u003cli>在“转角与存储方式”中添加、修改或移除方法使用的转角，并在同一行选择“区间平均”或“全时保存”；再设置采集帧数、暗帧数、重复次数、预激发及其他激发条件。\u003c/li>\n\u003cli>按旧版六项设置普通样品、标准样品、管理样重复次数，以及“重复摄谱最大允许误差[^P]”“相对偏差校验”“最大允许Rsd[%]”。关闭校验时停用对应Rsd输入；校准阈值、质控阈值、异常阈值和标准样品名称不在此编辑，已有值保留。\u003c/li>\n\u003cli>需要逐线选择曝光帧时开启“区间曝光”，至少采集两帧；关闭时使用简单均值。\u003c/li>\n\u003cli>点击顶部“保存”，一次完成条件校验和新有效版本保存；转角与存储方式一起保存，存储范围自动覆盖全部采集帧，不再填写第二套起止帧。原有历史版本保持。无效输入、重名或版本冲突时本次修改不写入，界面保留输入。\u003c/li>\n\u003c/ol>\n\u003ch2>数值输入与保存\u003c/h2>\n\u003cp>输入框可以暂时清空以便重新填写；提交时仍需满足有效范围。出现字段错误时按提示修正，不能把空值当作零值或已保存。采样周期、帧数、重复次数和保存区间会影响采集内容，应在发布前统一核对。\u003c/p>\n\u003cp>在「方法管理与参数」完成编辑后点击「保存」，生成可使用的版本。已有采集仍引用当时的方法版本。\u003c/p>\n"},{"id":"lines","group":"methods","title":"配置分析谱线","entry":"光谱方法 → 分析谱线","related":["standard-names","conditions","profiles"],"html":"\u003cp>进入“分析谱线”页签：\u003c/p>\n\u003col>\n\u003cli>添加分析线、内标线、定位线等所需谱线。\u003c/li>\n\u003cli>为每条谱线设置元素、波长、峰值/拟合参数、单位、有效范围和内标关系。单位可选 \u003ccode>ug/g\u003c/code>、\u003ccode>mg/g\u003c/code>、\u003ccode>%\u003c/code>，切换时同步质量比标准值、有效范围与精度；检查数值后保存。内标使用“背景做内标”或“内标谱线”，坐标使用“对数坐标”勾选。CCD和转角归属由方法及检测结果显示；转角统一在方法参数页配置。\u003c/li>\n\u003cli>可用关键字、谱线类型、CCD 或转角筛选。核对 CCD 覆盖带与谱线检测状态。批量预览只显示所选谱线。\u003c/li>\n\u003cli>对分析线设置标准点名称和标准值。标准点名称必须与后续标准样品的样品名完全对应，例如方法中使用 \u003ccode>S1\u003c/code>，采集的标准样品也应命名为 \u003ccode>S1\u003c/code>。\u003c/li>\n\u003cli>开启区间曝光后，在编辑区顶部的“谱线曝光区间”中填写该谱线的“曝光起始帧”和“曝光结束帧”，保存每条谱线，直到方法顶部不再显示待修正项。采集存储选择统一在方法页维护，本页只设置逐线计算参数。\u003c/li>\n\u003c/ol>\n\u003ch2>谱线类型\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>分析线：\u003c/strong>参与待测元素定量。\u003c/li>\n\u003cli>\u003cstrong>内标线：\u003c/strong>用于已配置的内标关系。\u003c/li>\n\u003cli>\u003cstrong>定位线：\u003c/strong>辅助谱线定位。\u003c/li>\n\u003cli>\u003cstrong>基线：\u003c/strong>用于方法中的背景/基线相关处理。\u003c/li>\n\u003c/ul>\n\u003cp>波长必须是有效数值且满足检测范围。保存失败时查看字段提示；不要在非法输入后继续发布方法。内标引用、CCD 与校准范围应一致。\u003c/p>\n"},{"id":"standard-names","group":"methods","title":"标准点与标准样名称对应","entry":"光谱方法 → 分析谱线；分析测试 → 样品分析 → 标准曲线","related":["queue","capture-create","curves","faq-curves"],"html":"\u003ch2>核心规则\u003c/h2>\n\u003cp>方法分析线里的标准点名称，要与采集得到的\u003cstrong>标准样品名称完全对应\u003c/strong>。例如标准点使用 S1、S2、S3、S4，采集时也使用这些名称，并将样品类型设为“标准样”。\u003c/p>\n\u003cp>未知样品使用独立名称，例如 QA-1。不要把未知样品命名为某个标准点，也不要仅靠队列顺序代替名称匹配。\u003c/p>\n\u003ch2>操作检查\u003c/h2>\n\u003col>\n\u003cli>在分析谱线中保存标准点名称和已知标准值。\u003c/li>\n\u003cli>建立队列或采集任务时核对样名、类型和重复次数。\u003c/li>\n\u003cli>完成采集、分析及重复性质控。\u003c/li>\n\u003cli>打开标准点视图，确认每个启用点都能获得有效强度。\u003c/li>\n\u003cli>再拟合并发布标准曲线。\u003c/li>\n\u003c/ol>\n\u003cp>示例名称只用于说明对应规则，不提供通用标准浓度。实际标准值应来自您采用的标准样资料。\u003c/p>\n"},{"id":"preview","group":"methods","title":"参数预览与打印","entry":"光谱方法 → 预览与打印","related":["method-publish","print-settings","exports"],"html":"\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>确认当前方法和要查看的版本。\u003c/li>\n\u003cli>进入“参数预览与打印”，检查方法条件、谱线、内标关系与标准点。\u003c/li>\n\u003cli>如需调整版式，进入\u003ca href=\"#print-settings\">页面与打印机设置\u003c/a>。\u003c/li>\n\u003cli>生成预览，检查页数、边距、表格与中文显示。\u003c/li>\n\u003cli>使用方法 PDF 输出或打印入口，并核对保存位置或打印结果。\u003c/li>\n\u003c/ol>\n\u003ch2>发布前检查\u003c/h2>\n\u003cp>预览用于复核，不会替代保存草稿和发布。待修正项为 0 后，仍需在方法操作栏执行“发布”和“设为当前”。\u003c/p>\n"},{"id":"queue","group":"analysis","title":"样号与样品队列","section":"准备与采集","entry":"分析测试 → 样号与样品队列","related":["standard-names","capture-create","formats"],"html":"\u003cp>进入“分析测试 → 样号与样品队列”。\u003c/p>\n\u003col>\n\u003cli>点击“新建队列”。\u003c/li>\n\u003cli>输入队列名称、样品名和重复次数。\u003c/li>\n\u003cli>点击“创建队列”。\u003c/li>\n\u003cli>继续输入其他样品，点击“插入样品”。\u003c/li>\n\u003cli>12位和20位样号统一显示为铺满可用宽度的表格，格宽按所选位数的数字、字母宽度调整，较长中文在格内换行。每列20个位置，先向下填满再进入右侧一列；列数由样号位数和窗口宽度确定，空位置也保留。新增样品只填入下一个格子，不重新分配已有样品；当前页满后用表格上方的翻页按钮查看。\u003c/li>\n\u003cli>点击样号，在表格下方核对预录名称、重复次数、展开谱带数和采集后名称；删除按钮作用于当前选中的样品。双击格子、选中后按F2或点击“修改样号”可编辑既有预录名称，回车或“保存样号”保存，Esc或“取消修改”放弃。编辑期间不能切换队列、位数或追加样品；失败时保留输入，修正后再保存。已关联采集的样品使用采集后命名，不能更改原预录名称。切换位数或窗口宽度时调整格宽和列数；已有名称超过目标位数时拒绝缩短，保留完整数据。\u003c/li>\n\u003cli>如果已有旧 \u003ccode>.sam\u003c/code> 文件，可点击“导入 SAM”；导入后仍应核对名称和重复次数。\u003c/li>\n\u003cli>需要交换队列时可点击“导出 SAM”并选择保存位置。\u003c/li>\n\u003c/ol>\n\u003cp>用于标准曲线的标准样品名称必须与方法分析线中的标准点名称一致。普通未知样品应使用不会与标准点重名的名称。\u003c/p>\n"},{"id":"dispersion","group":"analysis","title":"色散摄谱与校准","section":"准备与采集","entry":"分析测试 → 色散摄谱","related":["devices","conditions","mercury"],"html":"\u003cp>如果已有适用的已发布色散校准，可跳到第 6 步。\u003c/p>\n\u003cp>进入“分析测试 → 色散摄谱”采集数据；完成后进入独立的“分析测试 → 色散曲线”处理。\u003c/p>\n\u003col>\n\u003cli>在设备参数选择并保存当前设备，再到色散摄谱点击“新建任务”；CCD布局按当前设备规格匹配，不要求打开分析方法。\u003c/li>\n\u003cli>在独立窗口填写预激时间、采样周期、采样次数、空白次数和色散曲线名；预激1至10秒、周期1至2秒、采样1至255次、空白0至20次。\u003c/li>\n\u003cli>点击窗口底部“确定”，进入当前采集页后再点击“试样摄谱”，自动完成本次摄谱。\u003c/li>\n\u003cli>需要预热时使用独立的“预热摄谱”，完成后仅观察谱图，不制作正式色散曲线；需要时使用“暂停”“继续”或“停止摄谱”安全收尾。\u003c/li>\n\u003cli>完成或停止采集后，进入“分析测试 → 色散曲线”，选择刚采集的记录。在谱图上选中已确认的谱峰，点顶部“＋”增加谱线；点“－”删除所选线。至少准备四条校准谱线。\u003c/li>\n\u003cli>“校正谱线”按旧版10点窗口寻峰；无唯一有效峰时提示失败并保留位置，重复定位保持稳定。选中谱线后可用Ctrl＋左右方向键逐点移动，右键谱线标记或谱线列表可保存全部位置、还原当前或全部位置；这些恢复点不替代本次拟合结果。\u003c/li>\n\u003cli>点击「拟合曲线」打开拟合窗口，使用 4–8 个有效定位点，通常取 6 个。左表依次为序号、谱线波长、谱线位置、测量步数、校正步数和步数误差。波长列填写160–800 nm内的已知波长，回车或离开单元格提交；无效值还原。谱线位置以“(CCD编号,点位)”从1起显示；测量步数为计入CCD间隔的统一坐标。\u003c/li>\n\u003cli>需要调间隔时先选择顶部“CCD区间”，按“标尺”1／5／10 μm调节间隔。范围为标称间隔±允许误差；修改后只重算测量步数，旧拟合结果失效，需要明确点击“拟合曲线”。\u003c/li>\n\u003cli>检查每条谱线的校正步数和步数误差（测量减校正），以及右侧截距、一次／二次系数、每步波长、波长范围、步数范围。步数按旧版显示一位小数，波长显示四位；保存门禁仍按未舍入最大误差判断。\u003c/li>\n\u003cli>误差合格后点“保存曲线”，在名称窗口选择已有曲线或填写新名称；保存成功退出拟合窗口，同名曲线以新版本保存。到方法参数的“色散曲线”下拉中选用即可。重命名／归档和需要时的“绑定修订”位于独立“曲线管理”，不混入旧式拟合窗口。\u003c/li>\n\u003cli>勾选“保存激发条件”后点击“确定”，仅在建立成功时保存本类型的下次默认条件。未勾选、取消或失败都不覆盖默认；色散与蒸发独立保存，已建立任务不改写。\u003c/li>\n\u003c/ol>\n\u003cp>色散原始帧和已发布校准版本不可原地修改。残差超限时应检查定位点，不要强行把不可发布草稿用于正式方法。\u003c/p>\n"},{"id":"capture-create","group":"analysis","title":"创建样品摄谱任务","section":"准备与采集","entry":"分析测试 → 样品摄谱","related":["capture-run","queue","standard-names"],"html":"\u003col>\n\u003cli>打开当前方法；激发、CCD布局和保存条件沿用该方法。\u003c/li>\n\u003cli>在“工具 → 设备调试 → 设备参数”选择并保存当前设备。此选择会保存并供新建样品摄谱使用。\u003c/li>\n\u003cli>在“分析测试 → 样号与样品队列”选择或建立当前样号表；逐个样号、类别、重复次数和样号长度在这里维护。\u003c/li>\n\u003cli>进入样品摄谱，点击“新建任务”，只填写“样品摄谱编号”，再点击“确定”。编号是本次数据的名称，与逐个样号分开，不受样号12／20位限制。\u003c/li>\n\u003cli>缺少有效当前方法、设备或待测样号时，会提示到相应页面完成设置，不会静默选用第一份方法、模拟器或样号表。创建成功后进入工作台，仍需装样并手动激发。\u003c/li>\n\u003c/ol>\n\u003ch2>创建后检查\u003c/h2>\n\u003cp>任务列表出现新任务，方法版本、样品类型、保存模式与重复次数正确。创建任务不等于已经采集，下一步选中任务并启动。\u003c/p>\n"},{"id":"evaporation","group":"analysis","title":"蒸发摄谱实验","section":"准备与采集","entry":"分析测试 → 蒸发摄谱","related":["capture-create","dispersion","interval"],"html":"\u003cp>先打开当前方法，并在设备参数选择、保存当前设备。进入“分析测试 → 蒸发摄谱”，点击“新建任务”。窗口只提供预激时间、采样周期、采样次数、空白次数、“保存激发条件”复选框和蒸发曲线名；名称默认带当前方法与时间，可修改。CCD布局与选择自动沿用当前方法，四项激发条件独立设置；每次固定单次全时保存，不使用样品队列或重复次数。勾选后，只有点击“确定”并建立成功才保存蒸发的下次默认条件；未勾选、取消或失败不覆盖，与色散默认条件互不影响。\u003c/p>\n\u003cp>选中实验，点击共用控制区的“试样摄谱”，自动完成本次完整采集；“预热摄谱”独立执行，只供观察，不保存正式实验谱带。需要中断时点击“停止摄谱”。摄谱页显示实时谱图及进度，手工区间命名、起止帧和“标记区间”已移除；完整时间序列仍按原设置保存。采集进度、完成、警告和错误在统一“信息记录”查看，任务列表不再显示额外的实验记录详情或重命名面板。已有蒸发记录显示在蒸发模式，样品记录显示在样品模式。进入这两种摄谱模式仍需先选择有效的当前方法。\u003c/p>\n\u003cp>查看已保存的数据时，进入独立的“分析测试 → 蒸发曲线”，选择实验及CCD，在“曲线数据”中切换帧峰值或帧积分。横轴为实际采集时间（秒），表格列出对应帧和数值；查看不写入业务数据，损坏帧不参与绘图，读取失败会清空旧曲线并提示。这里显示的是整块CCD的帧峰值/积分，不能等同于旧版逐分析谱线的蒸发强度曲线。需要把旧 EDT 或系统蒸发记录的指定帧区间转为样品或色散数据时，进入「工具 → 导入预备摄谱文件」。\u003c/p>\n"},{"id":"capture-run","group":"analysis","title":"执行、暂停与停止采集","section":"准备与采集","entry":"分析测试 → 样品摄谱","related":["spectra","analysis","messages"],"html":"\u003col>\n\u003cli>新建成功会进入当前任务；查看已有任务时，在建立页列表点击“进入摄谱”或“查看谱图”。\u003c/li>\n\u003cli>核对样号、重复次数和当前装样状态。\u003c/li>\n\u003cli>点击“试样摄谱”后自动完成本次摄谱；每次完成后等待人工确认，重新装样后再点一次进行下一次重复。“预热摄谱”独立执行，不消耗正式重复次数、不生成正式分析谱带。\u003c/li>\n\u003cli>观察实时CCD曲线与运行阶段；需要采集进度和运行消息时，查看底部“信息记录”。\u003c/li>\n\u003cli>每次激发自动完成，下一次重复仍需人工装样后点击；需提前中断时使用“停止摄谱”。\u003c/li>\n\u003cli>发生异常时使用停止按钮进行安全收尾，不要强制结束后端进程。\u003c/li>\n\u003cli>等待任务状态变为“已完成”，并确认“结果”为“已收尾”。\u003c/li>\n\u003cli>建立任务前核对样号；任务列表保留任务及已保存谱图入口，不再提供额外的采后重命名面板。\u003c/li>\n\u003cli>查看统一“信息记录”的“常规信息”；需要查看通信过程时切换“通信命令”，确认没有未处理的错误或警告。\u003c/li>\n\u003cli>使用预录样品时，可直接在右侧“样品编号”下拉中选择同队列待测项，重复次数自动带出。首次选择待测项会按当前任务条件建立对应草稿，再次选择会复用该任务；确认装样后手动点击“试样摄谱”。当前项完成后仍会提示下一项或队尾，也可点击“下一样品”直接带出下一项，沿用本次编号与采集条件，不重复打开新建窗口。不会自动激发整条队列。\u003c/li>\n\u003c/ol>\n\u003cp>右侧第一个输入图标打开“预录样号”，选择或编辑队列后点击“使用此样号表”，即可回到工作台直接选样。保存期间不能关闭窗口或用Escape离开；失败保留输入。第三个清扫图标只清除待测选择，须重新选择后才能激发，不删除样品。\u003c/p>\n\u003cp>同一个标准样或未知样需要重复测量时，应让重复次数来自队列或任务设置，不要把一次未完成任务当作完整重复组。\u003c/p>\n"},{"id":"hardware","group":"analysis","title":"摄谱中的转角执行","section":"准备与采集","entry":"分析测试 → 色散摄谱／蒸发摄谱／样品摄谱","related":["devices","capture-run","hardware-limit"],"html":"\u003cp>色散、蒸发和样品摄谱在各自工作台执行转角。检查标题栏里的转角页签及当前方法。方法提供转角、谱线、关键波段及相应存储设置。连续采集可依序完成本次所需转角，也可选「仅摄本转角」逐角操作。\u003c/p>\n\u003cp>一次“试样摄谱”完成当前样品本次重复所需的全部转角，同一转角的谱线共用一次完整采集。方法标记的关键波段优先，多个关键转角按已有优先级从高到低、再按本次所需谱线的最短波长执行；其余转角按最短所需波长从短波到长波执行。完成整套计划后才计为一次重复；下一次仍需装样并再次点击“试样摄谱”，不自动跳过重复确认。\u003c/p>\n\u003cp>只有一个工作转角时沿用固定角度，方法选中的CCD都在这一角度采集，CCD通信分组不代表实际转角。多转角必须有明确的转角、CCD、波段和色散标定关联；缺失、歧义或标定无效时明确提示并阻止建立任务，不使用默认点位补齐。现有缺少关联的多转角方法须经设备资料或实测核实后补齐方法关联，当前方法前端不新增关联配置项。\u003c/p>\n\u003cp>摄谱窗口中的“查看转角”只切换观察，不能修改方法或执行顺序；采集中跟随当前实际转角。已完成谱带、原始帧及分析输入保留当时实际角度，重复使用同一CCD的不同角度结果分别保存。预热不占正式样号和重复次数；停止、到位失败或会话丢失保留已收帧，不确认不完整重复。历史独立转角记录、异常处置及兼容读取接口保留。\u003c/p>\n\u003cp>模拟设备可复核控制流程。现场仍需验收真实 CCD 响应、电机到位、汞灯光谱和仪器收尾。\u003c/p>\n"},{"id":"spectra","group":"analysis","title":"谱图查看、叠加与定位","section":"查看与分析","entry":"分析测试 → 谱图查看","related":["capture-run","analysis","exports","interval"],"html":"\u003cp>进入“分析测试 → 谱图查看”。\u003c/p>\n\u003col>\n\u003cli>从左侧记录区右键菜单选择「选择谱文件」，或点击「打开谱文件」。选择文件后点选所需记录。\u003c/li>\n\u003cli>选取转角、CCD 及谱线，填写曝光区间。可用图内标记和「定位谱线」定位，也可用 F5 校参考线、F6 校正谱线。\u003c/li>\n\u003cli>用十字线、框选和横纵缩放检查峰位与强度。方向键可逐点移动，按住 Ctrl 可暂时冻结读数。\u003c/li>\n\u003cli>原始帧可从谱图区右键菜单「查看原始帧」按燃烧帧或暗帧读取，帧号从 1 开始。分时跟随按工作台开放，例如在蒸发曲线可从谱图区右键打开。\u003c/li>\n\u003cli>打印或导出前核对样品、转角、CCD、曝光区间和当前可见范围。打印时可核对图层、纸型和打印比例。\u003c/li>\n\u003c/ol>\n\u003cp>“参考校正”只影响当前查看和输出口径；需要形成正式校准时应回到色散校准流程。分析页的“谱图”选中谱线后，会按该线固化的曝光区间重建观察谱带，并显示当前区间，便于与定量取段核对。查看不会改写历史分析结果。\u003c/p>\n"},{"id":"analysis","group":"analysis","title":"定量分析与逐谱线慢进","section":"查看与分析","entry":"分析测试 → 样品分析","related":["profiles","quality","faq-analysis"],"html":"\u003cp>进入“分析测试 → 样品分析”，展开“建立分析运行”。\u003c/p>\n\u003col>\n\u003cli>输入分析批次名称。\u003c/li>\n\u003cli>选择计算档案：\u003cul>\n\u003cli>\u003ccode>modern_v1\u003c/code>：现代高斯面积定量。\u003c/li>\n\u003cli>\u003ccode>legacy_2_0_2\u003c/code>：旧版峰高计算口径。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>根据需要启用“逐谱线慢进”，并设置慢进超时。\u003c/li>\n\u003cli>勾选已完成采集的样品。同一批次只能使用同一个方法版本的样品。\u003c/li>\n\u003cli>点击“建立并锁定输入”。\u003c/li>\n\u003cli>点击“开始”。\u003c/li>\n\u003cli>如果启用了慢进，出现检查点时查看峰位周边谱图：\u003cul>\n\u003cli>自动峰位正确：可保持当前峰位并点击“接受调整”。\u003c/li>\n\u003cli>需要人工修正：输入调整后峰位和理由，再点击“接受调整”。\u003c/li>\n\u003cli>不采用人工调整：点击“放弃调整”，系统使用自动定位结果。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>点击“推进一条谱线”，重复处理后续检查点，直到分析状态为“已完成”。\u003c/li>\n\u003cli>在“谱图与测量”检查峰位、峰高、背景、Sigma、面积和定量信号。\u003c/li>\n\u003c/ol>\n\u003cp>人工峰位调整、理由、输入哈希和最终结果都会写入审计记录。\u003c/p>\n"},{"id":"quality","group":"analysis","title":"重复性质控","section":"质控、曲线与结果","entry":"分析测试 → 样品分析 → 重复性检查","related":["analysis","curves","results"],"html":"\u003col>\n\u003cli>分析完成后会自动进入同一工作区复核；右侧“重复性检查”直接显示当前谱线的统计，按需选择检查样品。\u003c/li>\n\u003cli>查看均值、极差、标准差、RSD、ID 和有效次数。\u003c/li>\n\u003cli>有警告时，先检查各次重复值。\u003c/li>\n\u003cli>可以“接受提示”，也可以剔除明显异常重复；误剔除时点击“恢复”。\u003c/li>\n\u003cli>点击“重新统计”，确认质控快照显示“可用于拟合”。\u003c/li>\n\u003c/ol>\n\u003ch2>完成后检查\u003c/h2>\n\u003cp>确认有效重复次数、提示接受与剔除决定正确，再重新统计形成可用快照。不要为了让曲线可发布而无依据地剔除数据。\u003c/p>\n"},{"id":"curves","group":"analysis","title":"拟合并发布标准曲线","section":"质控、曲线与结果","entry":"分析测试 → 样品分析 → 标准曲线","related":["standard-names","quality","results","faq-curves"],"html":"\u003col>\n\u003cli>打开“标准点”视图，确认每个标准点都找到了同名标准样品并显示原始强度。\u003c/li>\n\u003cli>必要时停用异常标准点，或保存修正强度；所有修正都需要留下明确理由。\u003c/li>\n\u003cli>打开“曲线图”视图。\u003c/li>\n\u003cli>选择拟合方式：直线、二次、三次或样条。\u003c/li>\n\u003cli>用“对数坐标”复选框切换坐标；分析单位沿用谱线设置，百分含量的曲线刻度及下游结果保持一致。\u003c/li>\n\u003cli>点击“重新拟合”。\u003c/li>\n\u003cli>核对相关系数 R、有效点数、最大相对误差和各标准点反算值。需要排查拟合时展开残差图，悬停可联动对应点与表格。\u003c/li>\n\u003cli>可使用图像预览、文本预览或打印 PDF 复核。\u003c/li>\n\u003cli>需要微调时，在曲线图选择标准点，用标尺1/5及上下按钮，或Ctrl＋上下调整强度；Ctrl＋左右选点，Insert切标尺。修改后旧拟合标为过期，必须重新拟合再打印或发布。\u003c/li>\n\u003cli>确认后点击“保存曲线”（内部仍生成有效的不可变版本），再点击“下一条谱线”。左侧可随时返回已处理谱线；修改质控或标准强度后须重新拟合、保存。\u003c/li>\n\u003c/ol>\n"},{"id":"results","group":"analysis","title":"合并并保存样品结果","section":"质控、曲线与结果","entry":"分析测试 → 样品分析 → 标准曲线 → 样品结果","related":["curves","reports","faq-report"],"html":"\u003col>\n\u003cli>最后一条曲线保存后，点击“完成并保存结果”，自动合并并显示“样品结果”；也可以在页内切换查看。\u003c/li>\n\u003cli>确认所有分析谱线都已有已发布曲线快照。\u003c/li>\n\u003cli>检查样品的有效次数、均值强度、分析值和单位。\u003c/li>\n\u003cli>如需再次保存当前合并结果，可点击“合并并保存”。\u003c/li>\n\u003cli>记录合并快照编号和结果哈希。报告应使用这个最终合并结果。\u003c/li>\n\u003c/ol>\n\u003ch2>为什么还要合并\u003c/h2>\n\u003cp>分析运行中的原始结果、曲线拟合结果和最终报告来源是不同阶段。只有完成相应质控与曲线发布，再“合并并保存”，报告才有可追溯的最终结果可用。\u003c/p>\n"},{"id":"interval","group":"data","title":"全时数据与预备摄谱转换","entry":"数据处理 → 打印与导出 → 全时数据","related":["spectra","recalculate","formats"],"html":"\u003cp>在「数据处理 → 打印与导出 → 全时数据」选择 CMT 或支持的样品摄谱批次，核对当前方法与燃烧帧区间，再保存 XLSX。只有平均谱的记录无法还原每一帧。\u003c/p>\n\u003cp>需要转换旧 EDT 或蒸发记录的部分帧时，进入「工具 → 导入预备摄谱文件」，选择源记录、帧区间、保存方式与输出目标。选择追加或替换时，先核对目标。原始文件按只读方式处理。\u003c/p>\n"},{"id":"recalculate","group":"data","title":"重新计算与强度输出","entry":"数据处理 → 重新计算","related":["profiles","curves","migrate-results","exports"],"html":"\u003col>\n\u003cli>在「数据处理 → 重新计算」选择源记录、确切方法版本、计算档案及曲线。完成重算后核对批次、标准点和结果。\u003c/li>\n\u003cli>在「数据处理 → 打印与导出 → 强度数据」选择已完成的分析批次，可查看逐样、逐重复的峰值／背景强度，按页面提供的格式保存或打印。\u003c/li>\n\u003cli>在「数据处理 → 打印与导出 → 全时数据」打开旧 CMT 或选择支持的样品摄谱批次。核对方法谱线和燃烧帧区间，执行导出并检查生成的 XLSX。\u003c/li>\n\u003cli>需要转换旧 EDT 或系统蒸发记录时，进入「工具 → 导入预备摄谱文件」，选源记录、帧区间、保存方式和输出目标。提交前检查新建、追加或替换的选择。\u003c/li>\n\u003c/ol>\n"},{"id":"reports","group":"data","title":"建立、确认与输出分析报告","entry":"数据处理 → 打印与导出 → 分析报告","related":["results","exports","faq-report"],"html":"\u003cp>进入“数据处理 → 打印与导出 → 分析报告”。\u003c/p>\n\u003col>\n\u003cli>输出分析结果时，先在“分析测试 → 样品分析”打开已完成并保存合并结果的批次，再进入报告页；当前批次会自动带入。输出旧 DAT 时，点击标题栏右侧“打开报告文件”，每次只使用打开的这一份文件，无需填写单位；新报告保留原数值，未记录的单位留空并作说明。\u003c/li>\n\u003cli>可填写报告编号；留空时由系统生成。\u003c/li>\n\u003cli>选择报告模板。\u003c/li>\n\u003cli>选择“常规排列”或“交换排列”。\u003c/li>\n\u003cli>需要时填写样品筛选和元素筛选。\u003c/li>\n\u003cli>点击“建立报告版本”。\u003c/li>\n\u003cli>刚建立的草稿会自动选中；报告版本列表仍可打开已有报告。\u003c/li>\n\u003cli>点击“预览”，核对样品、元素、方法版本、计算档案、质控状态和结果。\u003c/li>\n\u003cli>关闭预览后点击“确认报告”。确认后才能作为正式输出来源。\u003c/li>\n\u003cli>点击“Excel”或“PDF”，在保存窗口选择位置；需要纸面输出时选择 Windows 打印机后点击“打印”。\u003c/li>\n\u003cli>根据页面提示确认保存或打印结果。打开另一份数据会替换当前来源；取消或打开失败保留当前数据和填写内容。\u003c/li>\n\u003c/ol>\n\u003cp>同名输出采用自动加后缀策略，不会静默覆盖已有报告。\u003c/p>\n"},{"id":"exports","group":"data","title":"文件保存、导出与打印","entry":"各页面的保存、导出或打印入口","related":["reports","print-settings","spectra","queue"],"html":"\u003ch2>两种保存方式\u003c/h2>\n\u003cp>\u003cstrong>弹出“另存为”对话框：\u003c/strong>常见于运行消息、方法 PDF、谱图 CSV/PDF、SAM 队列等前端生成的文件。选择位置并确认保存；取消不会产生文件。浏览器开发模式使用浏览器下载行为。\u003c/p>\n\u003cp>\u003cstrong>页面内填写输出目录：\u003c/strong>报告和后处理矩阵使用对应页面的目录与文件名设置。先确认目录已存在、可写，再导出，以成功提示中的实际路径为准。\u003c/p>\n\u003ch2>选择格式\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需要做什么\u003c/th>\n\u003cth>常用格式与入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>查看和提交排版结果\u003c/td>\n\u003ctd>报告 PDF、方法 PDF、谱图 PDF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续整理表格数据\u003c/td>\n\u003ctd>报告或矩阵 CSV / Excel\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>简单文本交换\u003c/td>\n\u003ctd>报告或矩阵 TXT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交换样品队列\u003c/td>\n\u003ctd>样品队列 SAM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保存故障上下文\u003c/td>\n\u003ctd>运行消息 LOG\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>输出前后检查\u003c/h2>\n\u003col>\n\u003cli>确认方法版本、样品、元素、CCD 和所选范围。\u003c/li>\n\u003cli>报告先预览并确认；方法和谱图按当前预览或可见范围输出。\u003c/li>\n\u003cli>执行保存，等待明确的成功提示。\u003c/li>\n\u003cli>打开最终文件检查内容和文件名。同名文件可能增加后缀，应记录实际路径。\u003c/li>\n\u003c/ol>\n\u003cp>实体打印还需选择可用 Windows 打印机并检查打印队列。不要把生成 PDF 与纸张已打印混为一谈。\u003c/p>\n"},{"id":"devices","group":"tools","title":"设备调试与实时观察","entry":"工具 → 设备调试","related":["dispersion","capture-create","hardware-limit"],"html":"\u003cp>进入“工具 → 设备调试 → 调试对中”。\u003c/p>\n\u003col>\n\u003cli>在「设备参数」选用模拟设备。在对中的「调试设置」可核对串口、CCD 布局和屏幕参数，并选模拟样本和随机种子。\u003c/li>\n\u003cli>点击“连接诊断”，再点击“开始”，同时观察上下排列的三块 CCD 实时曲线。\u003c/li>\n\u003cli>第一视图区固定使用设备安装顺序中的第一个 CCD。点击第二或第三块曲线后，使用工具栏的 CCD 图标更换该视图区；已经显示的 CCD 不可重复选择，已安装 CCD 不足三块时对应视图区留空。\u003c/li>\n\u003cli>青色条显示当前三块 CCD 中最大的有效峰值和位置（原始强度须大于1000），下方白色条显示鼠标所在点的原始强度与1起点位。红色 CCD 标签表示当前活动视图区。\u003c/li>\n\u003cli>“扣除背景”默认勾选，将显示下限设为该 CCD 的实测最小强度；取消时从0开始显示。它不修改原始帧、峰值或点位读数。\u003c/li>\n\u003cli>查看工具、区域放大、一线一点／一线四点／十倍 CCD、横向及纵向缩放只作用于活动视图区；十倍 CCD 需要有效的点宽和屏幕换算参数。“适合图像”仅还原当前横向范围，“纵向还原”还原当前纵向倍率，“还原全部 CCD 视图”同时恢复三块的范围、倍率和查看工具，保留 CCD 选择。\u003c/li>\n\u003cli>光标可用左右方向键逐点移动，上下键调整当前纵向倍率。点位越出视区时，曲线随光标移动。\u003c/li>\n\u003cli>检查完成后点击“停止”“断开”，或点击工具栏的“结束调试”一次完成停止和断开。停止请求失败时保留重试入口并暂停继续取帧；停止后最后一帧仅留在页面内存供观察。\u003c/li>\n\u003c/ol>\n\u003cp>实时调试不会生成样品或谱图记录，状态栏显示 \u003ccode>0 样品 · 0 谱图\u003c/code>。小窗口可纵向滚动查看三块曲线，避免压缩到不可读。\u003c/p>\n\u003cp>设备调试提供「软件参数」「设备参数」「设备连接」「调试对中」四个页签。软件参数保存四项分析选项，设备参数保存串口、屏幕换算与 CCD 配置。调试运行及请求处理期间可以切换页签，各项操作按所属权限开放。备份与历史日志清理位于「系统管理 → 备份与维护」，主题从顶栏切换。\u003c/p>\n\u003ch2>在调试对中切换转角\u003c/h2>\n\u003cp>汞灯由仪器自动开启。进入「工具 → 设备调试 → 调试对中」，点「连接诊断」，从上方选择要观察的转角，点「切换转角」。收到电机到位回执后，界面显示当前转角。开始实时对中后也可以切角，继续在原来的三路 CCD 谱图上观察。\u003c/p>\n\u003cp>转角列表取自当前方法。未配置方法转角时，真实设备可使用「设备连接」中已标定的电机角度映射。\u003c/p>\n"},{"id":"mercury","group":"tools","title":"调试对中切换转角","entry":"工具 → 设备调试 → 调试对中","related":["dispersion","devices","hardware-limit"],"html":"\u003cp>汞灯由仪器自动开启。进入「工具 → 设备调试 → 调试对中」，点「连接诊断」，从上方选择要观察的转角，点「切换转角」。收到电机到位回执后，界面显示当前转角。开始实时对中后也可以切角，继续在原来的三路 CCD 谱图上观察。\u003c/p>\n\u003cp>转角列表取自当前方法。未配置方法转角时，真实设备可使用「设备连接」中已标定的电机角度映射。\u003c/p>\n"},{"id":"migrate-methods","group":"tools","title":"旧方法与配置迁移","section":"旧版数据迁移","entry":"工具 → 旧数据迁移 → 方法与配置","related":["method-publish","formats","migrate-spectra"],"html":"\u003cp>进入“工具 → 旧数据迁移 → 方法与配置”。\u003c/p>\n\u003col>\n\u003cli>确认“Jet 读取器就绪”。读取器不可用只会阻止旧方法迁移，不影响新建方法和日常分析。\u003c/li>\n\u003cli>点击“选择旧版目录”，从检测结果选取方法库，程序会填入 MTD、CFG、OPT 路径。也可以在下方分别填写三个文件的完整路径。\u003c/li>\n\u003cli>点击“只读暂存并校验”。\u003c/li>\n\u003cli>检查迁移报告中的方法数、谱线数、色散曲线数、源文件 SHA-256 和全部一致性检查。\u003c/li>\n\u003cli>确认报告无阻断问题后，点击“原子提交”。\u003c/li>\n\u003c/ol>\n\u003ch2>数据保护\u003c/h2>\n\u003cp>原始 MTD、CFG、OPT 保持只读。先检查暂存报告再提交，读取器失败时保存诊断，不通过修改历史原件解决。迁移后检查方法草稿与已发布状态，再选择适合的当前方法。\u003c/p>\n"},{"id":"migrate-spectra","group":"tools","title":"旧谱数据迁移","section":"旧版数据迁移","entry":"工具 → 旧数据迁移 → 谱图数据","related":["formats","spectra","interval"],"html":"\u003ch2>支持的文件\u003c/h2>\n\u003cp>本入口处理 CDT、CMT、EDT、WDT 旧谱数据。DAT/PDT 结果文件使用\u003ca href=\"#migrate-results\">旧结果迁移\u003c/a>，SAM 使用\u003ca href=\"#queue\">样品队列\u003c/a>导入。\u003c/p>\n\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>选择旧谱文件，执行暂存与校验。\u003c/li>\n\u003cli>检查格式、CCD 布局、记录数、数据块、坏帧和源文件指纹。\u003c/li>\n\u003cli>报告无阻断问题后原子提交。\u003c/li>\n\u003cli>到\u003ca href=\"#spectra\">谱图查看\u003c/a>核对样品和曲线；全时数据需要时进入\u003ca href=\"#interval\">全时区间处理\u003c/a>。\u003c/li>\n\u003c/ol>\n\u003cp>解析在临时副本中进行，原件不回写。遇到未知格式、截断或损坏数据，应保留原件和报告，不更改扩展名来尝试导入。\u003c/p>\n"},{"id":"migrate-results","group":"tools","title":"旧结果迁移","section":"旧版数据迁移","entry":"工具 → 旧数据迁移 → 分析结果","related":["formats","recalculate","migrate-methods"],"html":"\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>在旧结果迁移页选择 DAT 或 PDT 文件。\u003c/li>\n\u003cli>执行只读暂存和校验。\u003c/li>\n\u003cli>检查样品、谱线、矩阵维度、方法匹配状态和源文件指纹。\u003c/li>\n\u003cli>无阻断问题后原子提交，核对迁移后的记录。\u003c/li>\n\u003c/ol>\n\u003ch2>方法匹配与后续使用\u003c/h2>\n\u003cp>无法匹配方法的结果应保留其来源和诊断，不要随意套用同名方法。精确重算还需指定确切方法版本、计算档案和已发布曲线快照，详见\u003ca href=\"#recalculate\">重算与矩阵导出\u003c/a>。\u003c/p>\n\u003cp>只读迁移不会覆盖旧 DAT/PDT，也不会把重新计算的结果写回旧格式。\u003c/p>\n"},{"id":"settings","group":"system","title":"主题、分析参数和备份目录","related":["files","backup","devices"],"html":"\u003col>\n\u003cli>顶栏「切换明暗主题」按钮在浅色与暗室深色之间切换，主题按账户记录。可收合侧栏，也可按 Ctrl+Shift+F 开关专注模式。\u003c/li>\n\u003cli>在「工具 → 设备调试 → 软件参数」的「分析参数」里配置「空白传输时间（秒）」。默认 8 秒，范围 6–20 秒。编辑方法采样周期时，据此重算空白次数。\u003c/li>\n\u003cli>在「系统管理 → 备份与维护」指定备份目录。在方法、谱图或报告的打印页面设置打印参数。\u003c/li>\n\u003c/ol>\n"},{"id":"users","group":"system","title":"用户与权限","entry":"系统管理 → 用户与权限","related":["login","faq-menu","faq-password","audit"],"html":"\u003ch2>账户和角色\u003c/h2>\n\u003cp>系统内置系统管理员、方法管理员、分析员、只读审计员等角色。管理员主要负责本机设置与身份管理，方法管理员负责方法配置，分析员执行分析流程，只读审计员查阅已授权记录。角色名称不等于拥有全部业务操作权限，以页面实际列出的权限为准。\u003c/p>\n\u003ch2>新建账户\u003c/h2>\n\u003col>\n\u003cli>使用具备用户管理权限的账户进入本页。\u003c/li>\n\u003cli>在创建用户区域填写用户名、至少 8 位的初始密码及角色。\u003c/li>\n\u003cli>点击创建按钮，刷新后核对账户列表、角色和启用状态。\u003c/li>\n\u003cli>新账户登录后检查所需入口是否可见。\u003c/li>\n\u003c/ol>\n\u003ch2>启用与停用\u003c/h2>\n\u003cp>在账户列表中对其他账户使用启用/停用按钮。当前界面不提供停用自身账户的操作。停用影响后续访问，不删除其历史操作记录。\u003c/p>\n\u003ch2>角色维护的边界\u003c/h2>\n\u003cp>本页可以查看角色权限，具备权限时可创建自定义角色。创建时按业务分组勾选权限，原始权限标识可展开详情查看；不再要求手填技术键。当前界面没有完整的既有用户角色改配或密码重置表单；不要按旧软件菜单寻找不存在的“重置密码”按钮。需要这些操作时联系维护人员，先保护现有数据。\u003c/p>\n"},{"id":"audit","group":"system","title":"审计记录","entry":"系统管理 → 审计记录","related":["users","messages","faq-evidence"],"html":"\u003ch2>查阅步骤\u003c/h2>\n\u003col>\n\u003cli>进入“审计记录”，点击“刷新”。\u003c/li>\n\u003cli>按时间倒序查看记录，核对操作者、动作、目标和详情。\u003c/li>\n\u003cli>对需要进一步解释的详情使用展开控件，记录对应时间及对象编号。\u003c/li>\n\u003c/ol>\n\u003ch2>与运行消息的区别\u003c/h2>\n\u003cp>运行消息主要帮助理解当前运行情况；审计用于追溯身份、方法、采集、分析、输出和维护等变更。审计记录不可在本页任意编辑或删除。\u003c/p>\n\u003cp>当前桌面审计页以刷新和倒序列表为主，没有独立的日期/动作筛选表单。查找大量记录时不要把其他页面的搜索功能当作本页筛选能力。\u003c/p>\n"},{"id":"backup","group":"system","title":"备份数据库与校验","entry":"系统管理 → 备份与维护","related":["maintenance","files","faq-password"],"html":"\u003cp>进入“系统管理 → 备份与维护”。\u003c/p>\n\u003col>\n\u003cli>确认数据库状态为“数据库正常”，外键错误为 0。\u003c/li>\n\u003cli>输入项目主文件夹之外的备份目录。\u003c/li>\n\u003cli>点击“创建备份”。\u003c/li>\n\u003cli>在备份记录中点击“校验”。\u003c/li>\n\u003cli>需要回收空闲空间时，先备份，再点击“整理数据库”。\u003c/li>\n\u003cli>「清理记录文件」清理 30 天前的历史日志，保留当前日志和审计记录。\u003c/li>\n\u003c/ol>\n\u003cp>不要在软件运行时直接复制 SQLite 主数据库来代替在线备份。\u003c/p>\n\u003cp>备份应放在独立目录，并定期确认文件可读取、校验通过。备份覆盖新版数据库，外部旧文件和导出文件另行保存。实际恢复由维护人员在保留现库后处理。\u003c/p>\n"},{"id":"maintenance","group":"system","title":"数据库整理与日志清理","entry":"系统管理 → 备份与维护","related":["backup","audit","files"],"html":"\u003ch2>数据库整理\u003c/h2>\n\u003cp>先创建并校验备份，再点击“整理数据库”回收空闲空间。整理不会删除业务结果。\u003c/p>\n\u003ch2>清理记录文件\u003c/h2>\n\u003cp>点击「清理记录文件」可清理 30 天前的历史日志。当前日志和审计记录保留。\u003c/p>\n"},{"id":"builtin-help","group":"help","title":"软件内的离线帮助","entry":"帮助 → 离线帮助","related":["faq-evidence","navigation","about"],"html":"\u003ch2>使用方式\u003c/h2>\n\u003cp>登录后进入“帮助 → 离线帮助”，在搜索框输入主题、关键词或错误码，选择左侧匹配主题阅读简要说明。清空搜索可恢复主题列表。\u003c/p>\n\u003ch2>与本手册的关系\u003c/h2>\n\u003cp>软件内帮助是当前内置的简要主题页；本文件提供更细的操作步骤、树形目录及正文跳转。软件内“关联模块”当前显示模块路径文本，并非本手册的可点击导航。\u003c/p>\n\u003cp>查找具体操作时可在本手册搜索框中输入“样品队列”“合并”“报告”等词。\u003c/p>\n"},{"id":"about","group":"help","title":"关于软件","entry":"帮助 → 关于软件","related":["overview","files","faq-evidence"],"html":"\u003ch2>查看内容\u003c/h2>\n\u003cp>「帮助 → 关于软件」可查看软件名称、版本和版权。管理员可按权限访问软件激活与模块远程诊断。\u003c/p>\n\u003ch2>出现问题时记录\u003c/h2>\n\u003cp>记录软件版本、发生时间和具体提示，结合\u003ca href=\"#messages\">运行消息\u003c/a>说明操作；管理员可补充模块检测结果。不要向无关人员发送密码、会话信息或完整业务数据库。\u003c/p>\n\u003cp>如果账户看不到此入口，先确认权限；不要将页面不可见等同于服务离线。\u003c/p>\n"},{"id":"faq-start","group":"help","title":"双击后没有窗口","section":"常见问题","related":["launch","faq-service"],"html":"\u003cul>\n\u003cli>确认 \u003ccode>GeoSpectrum.exe\u003c/code> 和 \u003ccode>geospectrum-backend.exe\u003c/code> 位于同一文件夹。\u003c/li>\n\u003cli>不要从压缩包内部直接运行。\u003c/li>\n\u003cli>检查 Windows 安全软件是否隔离了后端 EXE。\u003c/li>\n\u003cli>等待数秒后再试；单实例机制不会同时打开多个主窗口。\u003c/li>\n\u003c/ul>\n"},{"id":"faq-service","group":"help","title":"本地服务离线","section":"常见问题","related":["overview","about"],"html":"\u003cul>\n\u003cli>关闭主窗口后重新启动，不要单独启动后端。\u003c/li>\n\u003cli>检查后端文件是否被改名、移动或删除。\u003c/li>\n\u003cli>查看工作台运行消息中的错误码。具备权限的管理员可在「帮助 → 关于软件」查看模块远程诊断入口。\u003c/li>\n\u003c/ul>\n\u003ch2>重新启动后检查\u003c/h2>\n\u003cp>等待本地服务连接后查看工作台的最新消息和实际操作状态。若仍无法连接，保留版本、时间和错误提示后联系维护人员，不通过删除数据库重试。\u003c/p>\n"},{"id":"faq-menu","group":"help","title":"菜单灰色或找不到入口","section":"常见问题","related":["method-publish","users"],"html":"\u003cul>\n\u003cli>先在方法页保存有效版本，再从顶栏打开或切换到该方法。\u003c/li>\n\u003cli>如果入口完全不可见，请让管理员核对账户与角色权限；当前界面的角色修改能力有限，必要时联系维护人员处理。\u003c/li>\n\u003c/ul>\n"},{"id":"faq-curves","group":"help","title":"标准曲线无法拟合或发布","section":"常见问题","related":["standard-names","quality","curves"],"html":"\u003cul>\n\u003cli>确认分析已完成并生成质控快照。\u003c/li>\n\u003cli>确认标准样品类型为“标准样”。\u003c/li>\n\u003cli>确认标准样品名称与方法标准点名称完全一致。\u003c/li>\n\u003cli>确认每个启用标准点都有有效重复均值。\u003c/li>\n\u003cli>检查被剔除重复、RSD 警告、拟合点数和残差。\u003c/li>\n\u003c/ul>\n"},{"id":"faq-report","group":"help","title":"报告为空或不能输出","section":"常见问题","related":["results","reports","exports"],"html":"\u003cul>\n\u003cli>确认分析运行状态为“已完成”。\u003c/li>\n\u003cli>确认每条分析谱线已发布曲线快照。\u003c/li>\n\u003cli>确认已执行“合并并保存”。\u003c/li>\n\u003cli>报告草稿应先预览并“确认报告”。\u003c/li>\n\u003cli>输出目录必须已经存在，并且当前 Windows 用户具有写入权限。\u003c/li>\n\u003c/ul>\n"},{"id":"faq-password","group":"help","title":"忘记密码怎么办","section":"常见问题","related":["users","backup"],"html":"\u003cp>软件没有通用默认密码。当前桌面没有可直接操作的密码重置表单，请联系维护人员制定恢复方案。不要删除 \u003ccode>%LOCALAPPDATA%\\cn.geospectrum.desktop\u003c/code> 来重新初始化，这会使本机业务数据丢失。先保留现有数据与已验证备份。\u003c/p>\n"},{"id":"faq-analysis","group":"help","title":"分析没有完成或表单报错","section":"常见问题","related":["analysis","quality","faq-evidence"],"html":"\u003col>\n\u003cli>确认至少选择一个已完成采集的样品，输入属于同一个方法版本。\u003c/li>\n\u003cli>核对慢进超时等数值，修正表单中的持久错误提示；提交失败后不会自动产生有效运行。\u003c/li>\n\u003cli>建立并锁定输入后，选中运行再点击“开始”。\u003c/li>\n\u003cli>慢进状态需要处理检查点并推进，不是等待一段时间就一定会自动完成。\u003c/li>\n\u003cli>失败时保留错误说明和运行编号，再决定修正输入、重新采集或建立新运行。\u003c/li>\n\u003c/ol>\n\u003cp>不要将旧包的现象直接当作当前包的结论。报告问题时附上“关于软件”的版本；管理员可按权限在「关于软件」使用模块远程诊断。\u003c/p>\n"},{"id":"hardware-limit","group":"help","title":"真实设备与模拟器的区别","section":"常见问题","related":["devices","hardware","mercury"],"html":"\u003cp>在「工具 → 设备调试 → 调试对中」确认 CCD 已连接，再选择工作转角并点「切换转角」。汞灯由仪器自动开启。实际到位、光源和安全收尾需按现场验收要求核对。\u003c/p>\n\u003ch2>模拟器可以验证什么\u003c/h2>\n\u003cp>可用于熟悉界面、验证状态推进、样品数据处理和错误反馈。模拟帧与随机种子可支持重复验证，但不会证明真实串口连接、光学条件、仪器保护或测量性能已通过现场验收。\u003c/p>\n"},{"id":"faq-evidence","group":"help","title":"如何记录和反馈故障","section":"常见问题","related":["messages","about","backup"],"html":"\u003ch2>建议保留的信息\u003c/h2>\n\u003col>\n\u003cli>软件版本、构建标识和发生时间。\u003c/li>\n\u003cli>从哪个菜单进入、点击了什么、期望结果与实际结果。\u003c/li>\n\u003cli>方法及版本、任务或报告编号；必要时记下样品与 CCD。\u003c/li>\n\u003cli>完整错误码、原始错误内容及相关运行消息。\u003c/li>\n\u003cli>是否使用模拟器，是否只在某个输入或某个账户下发生。\u003c/li>\n\u003c/ol>\n\u003ch2>先做的检查\u003c/h2>\n\u003cp>确认任务已安全停止；保存消息和必要截图；检查输入及目录权限。不要先删除数据库、修改历史原件或反复覆盖输出文件。\u003c/p>\n\u003cp>对外提供资料前去除密码和无关业务数据；优先提供最小可复现步骤与诊断信息。\u003c/p>\n"},{"id":"files","group":"reference","title":"程序、数据库与备份在哪里","related":["launch","backup","settings"],"html":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>默认位置或说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>直接启动的主程序\u003c/td>\n\u003ctd>项目主文件夹中的 GeoSpectrum.exe\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配套后端\u003c/td>\n\u003ctd>与主程序同目录的 geospectrum-backend.exe，由主程序启动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本机构建安装包\u003c/td>\n\u003ctd>app/.local/releases/0.1.0/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正常运行数据库及相关数据\u003c/td>\n\u003ctd>%LOCALAPPDATA%\\cn.geospectrum.desktop\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报告与矩阵导出\u003c/td>\n\u003ctd>对应页面指定的输出目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在线备份\u003c/td>\n\u003ctd>备份与维护页面实际使用的目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本手册\u003c/td>\n\u003ctd>docs/使用与说明/GeoSpectrum_使用手册.html\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>打开用户数据目录\u003c/h2>\n\u003cp>在资源管理器地址栏输入 \u003ccode>%LOCALAPPDATA%\\cn.geospectrum.desktop\u003c/code> 并回车。只查看和定位即可，不要在程序运行时移动数据库及其日志文件。\u003c/p>\n\u003ch2>升级或复制程序\u003c/h2>\n\u003cp>主程序和后端必须来自同一次构建，并成对放置。移动程序不会自动搬迁用户数据库。便携演示版通过自己的启动脚本使用 demo-data，不能把演示数据库误认为正常账户的业务库。\u003c/p>\n"},{"id":"formats","group":"reference","title":"旧文件与输出格式速查","related":["migrate-methods","migrate-spectra","migrate-results","exports"],"html":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件类型\u003c/th>\n\u003cth>当前入口\u003c/th>\n\u003cth>处理方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DIRECT.MTD / DIRECT.CFG / DIRECT.OPT\u003c/td>\n\u003ctd>旧方法与配置迁移\u003c/td>\n\u003ctd>只读暂存、校验、提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CDT / CMT / EDT / WDT\u003c/td>\n\u003ctd>旧谱数据迁移\u003c/td>\n\u003ctd>保留原件和来源指纹\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DAT / PDT\u003c/td>\n\u003ctd>旧结果迁移\u003c/td>\n\u003ctd>保留结果与方法匹配诊断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SAM\u003c/td>\n\u003ctd>样号与样品队列\u003c/td>\n\u003ctd>导入或导出样品队列\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CSV / TXT / Excel\u003c/td>\n\u003ctd>报告或矩阵输出\u003c/td>\n\u003ctd>按所选结果和范围导出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PDF\u003c/td>\n\u003ctd>方法、谱图、曲线或报告\u003c/td>\n\u003ctd>按对应预览/页面设置生成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LOG\u003c/td>\n\u003ctd>运行消息\u003c/td>\n\u003ctd>保存操作与排错信息\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>迁移旧 Access 类格式不会回写原件，也不生成可供旧版回读的 Access 文件。不要根据相似扩展名推断支持范围。\u003c/p>\n"},{"id":"profiles","group":"reference","title":"计算档案与常用术语","related":["analysis","standard-names","backup","method-publish"],"html":"\u003ch2>计算档案\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>新版定量（支持峰面积）：\u003c/strong>高斯模式保存峰高、中心、Sigma 和面积，并以面积参与定量。\u003c/li>\n\u003cli>\u003cstrong>旧版兼容：\u003c/strong>用于复现旧版相关计算行为。\u003c/li>\n\u003c/ul>\n\u003cp>它们不是可以随意互换的显示选项。重算时明确选择，报告应保留所用档案，比较结果时同时核对档案和方法版本。\u003c/p>\n\u003ch2>常用术语\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>使用时的含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>草稿 / 发布版本\u003c/td>\n\u003ctd>可编辑准备状态 / 后续数据引用的不可变版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前方法\u003c/td>\n\u003ctd>当前运行选用的方法；不一定等于正在浏览的列表项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CCD / 点位 / 波长\u003c/td>\n\u003ctd>检测阵列、采样位置与经校准对应的波长坐标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>燃烧帧 / 暗帧\u003c/td>\n\u003ctd>采集阶段的原始帧类型，查看与处理时需区分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>平均谱 / 全时区间\u003c/td>\n\u003ctd>平均结果 / 保留逐帧过程的数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标准点 / 标准样\u003c/td>\n\u003ctd>方法中已知数值点 / 与之名称对应的实际采集样品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RSD\u003c/td>\n\u003ctd>相对标准偏差，结合方法阈值和有效重复次数检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>快照\u003c/td>\n\u003ctd>某次质控、曲线、合并或报告结果的固定记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SHA-256\u003c/td>\n\u003ctd>文件或数据内容指纹，用于核对来源与完整性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恢复演练\u003c/td>\n\u003ctd>在隔离副本中验证备份，不等于切换当前数据库\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"id":"protection","group":"reference","title":"数据保护与使用边界","related":["hardware-limit","backup","faq-evidence"],"html":"\u003cul>\n\u003cli>前后端 EXE 必须成对保留，升级时也必须使用同一次构建的两个文件。\u003c/li>\n\u003cli>旧版 MTD、CFG、OPT、CDT、CMT、EDT、WDT、DAT、PDT 和 SAM 原件保持只读，不要用新版程序覆盖。\u003c/li>\n\u003cli>方法发布版本、校准版本、质控快照、曲线快照和报告版本都是可追溯记录，不要用人工修改数据库代替业务操作。\u003c/li>\n\u003cli>使用“备份与维护”中的在线备份及校验，不要把手工复制数据库当作完整备份流程；实际恢复由维护人员在保留现库后处理。\u003c/li>\n\u003cli>出现错误时先记录错误码、任务编号、时间和运行消息，再决定重试、恢复或重新采集。\u003c/li>\n\u003c/ul>\n\u003ch2>本手册的使用边界\u003c/h2>\n\u003cp>手册中的模拟操作不代替真实设备说明、现场安全操作规程或正式发布验收。遇到界面与文档不同，先核对版本并保留提示；不要为了照着文档执行而绕过产品校验。\u003c/p>\n"}]};
const topics=DATA.topics, groups=DATA.groups, byId=new Map(topics.map(t=>[t.id,t]));
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=html=>{const d=document.createElement('div');d.innerHTML=html;return(d.textContent||'').replace(/\s+/g,' ').trim()};
const searchable=topics.map(t=>({...t,text:plain(t.html)}));
let position=0, maximum=0, fontSize=16, current='welcome', expanded=false;
history.replaceState({manual:true,position:0},'',location.href);
const groupName=id=>groups.find(g=>g.id===id).title;
const topicLink=t=>`<a class="tree-link" href="#${t.id}" data-topic="${t.id}">${escapeHtml(t.title)}</a>`;
function buildTree(){
 $('toc').innerHTML=groups.map((g,i)=>{
  const list=topics.filter(t=>t.group===g.id);let children='',section='';
  for(const t of list){
   if((t.section||'')!==section){if(section)children+='</div></details>';section=t.section||'';if(section)children+=`<details class="tree-subgroup"><summary>${escapeHtml(section)}</summary><div class="tree-children">`;}
   children+=topicLink(t);
  }
  if(section)children+='</div></details>';
  return `<details class="tree-group" data-group="${g.id}"${g.id==='start'?' open':''}><summary><span class="group-number">${String(i+1).padStart(2,'0')}</span>${escapeHtml(g.title)}</summary><div class="tree-children">${children}</div></details>`;
 }).join('');
 $('topic-count').textContent=`${groups.length} 章 · ${topics.length} 个主题`;
}
function showTab(search){
 $('toc').hidden=search;$('search-results').hidden=!search;
 for(const [id,active] of [['toc-tab',!search],['search-tab',search]]){$(id).setAttribute('aria-selected',String(active));$(id).tabIndex=active?0:-1;}
}
function route(){let value;try{value=decodeURIComponent(location.hash.slice(1))}catch{value='invalid'};const [id,anchor]=value.split('~');return{id:id||'welcome',anchor};}
function navigate(id){
 if(location.hash==='#'+id){render();return;}
 position++;maximum=position;history.pushState({manual:true,position},'','#'+id);render();
}
function closeMenu(){$('sidebar').classList.remove('open');$('menu-toggle').setAttribute('aria-expanded','false');}
function render(){
 const r=route();let t=byId.get(r.id);$('not-found').hidden=!!t;if(!t)t=byId.get('welcome');current=t.id;
 document.title=t.title+' — GeoSpectrum 使用手册';
 $('breadcrumbs').innerHTML=`<a href="#welcome">使用手册</a><span>›</span><a href="#${topics.find(x=>x.group===t.group).id}">${escapeHtml(groupName(t.group))}</a>${t.section?`<span>›</span><span>${escapeHtml(t.section)}</span>`:''}<span>›</span><span class="current">${escapeHtml(t.title)}</span>`;
 $('article').className=t.id==='welcome'?'welcome':'';
 const body=(!/<h[23][ >]/.test(t.html)&&t.id!=='welcome'?'<h2>操作说明</h2>':'')+t.html;
 $('article').innerHTML=`<header class="article-header"><div class="eyebrow">${escapeHtml(groupName(t.group))} / GEOSPECTRUM GUIDE</div><h1 id="topic-title">${escapeHtml(t.title)}</h1>${t.lead?`<p class="lead">${escapeHtml(t.lead)}</p>`:''}${t.entry?`<div class="entry"><strong>软件入口</strong>${escapeHtml(t.entry)}</div>`:''}</header><div class="article-body">${body}</div>`;
 const headings=[...$('article').querySelectorAll('.article-body h2,.article-body h3')];
 headings.forEach((h,i)=>h.id='section-'+i);
 $('outline').innerHTML='<strong>本页内容</strong>'+headings.map((h,i)=>`<a href="#${t.id}~section-${i}">${escapeHtml(h.textContent)}</a>`).join('');
 $('outline').hidden=!headings.length;
 $('related').innerHTML='<h2>继续阅读</h2><div class="related-links">'+(t.related||[]).map(id=>`<a href="#${id}">${escapeHtml(byId.get(id).title)} <span aria-hidden="true">↗</span></a>`).join('')+'</div>';
 $('related').hidden=!(t.related||[]).length;
 const index=topics.indexOf(t),prev=topics[index-1],next=topics[index+1];
 $('page-nav').innerHTML=(prev?`<a href="#${prev.id}"><span>← 上一页</span><strong>${escapeHtml(prev.title)}</strong></a>`:'<span></span>')+(next?`<a href="#${next.id}"><span>下一页 →</span><strong>${escapeHtml(next.title)}</strong></a>`:'<span></span>');
 document.querySelectorAll('.tree-link').forEach(a=>a.removeAttribute('aria-current'));
 const selected=document.querySelector(`.tree-link[data-topic="${t.id}"]`);
 if(selected){selected.setAttribute('aria-current','page');let ancestor=selected.parentElement;while(ancestor&&ancestor!==$('toc')){if(ancestor.tagName==='DETAILS')ancestor.open=true;ancestor=ancestor.parentElement;}}
 $('back').disabled=position<=0;$('forward').disabled=position>=maximum;
 $('main').scrollTop=0;closeMenu();
 if(r.anchor){const heading=headings.find(h=>h.id===r.anchor);if(heading)requestAnimationFrame(()=>heading.scrollIntoView({block:'start'}));}
}
function search(){
 const q=$('search').value.trim().toLocaleLowerCase();$('clear-search').hidden=!q;
 if(!q){$('result-list').innerHTML='';$('search-status').textContent='输入关键词，搜索标题和正文。';showTab(false);return;}
 showTab(true);const words=q.split(/\s+/).filter(Boolean);
 const results=searchable.map(t=>{const title=t.title.toLocaleLowerCase(),body=t.text.toLocaleLowerCase();return{t,score:words.every(w=>(title+' '+body).includes(w))?words.reduce((s,w)=>s+(title.includes(w)?10:1),0):0}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
 $('search-status').textContent=`找到 ${results.length} 个主题`;
 $('result-list').innerHTML='';
 if(!results.length){const p=document.createElement('p');p.className='empty';p.textContent='没有匹配主题。试试更短的关键词，例如“方法”“曲线”或“备份”。';$('result-list').append(p);return;}
 for(const {t} of results){const a=document.createElement('a');a.href='#'+t.id;a.className='search-result';const title=document.createElement('strong');title.textContent=t.title;const group=document.createElement('small');group.textContent=groupName(t.group)+(t.section?' / '+t.section:'');const snippet=document.createElement('p');const start=Math.max(0,t.text.toLocaleLowerCase().indexOf(words[0])-22);snippet.textContent=(start?'…':'')+t.text.slice(start,start+95)+(start+95<t.text.length?'…':'');a.append(title,group,snippet);$('result-list').append(a);}
}
document.addEventListener('click',event=>{
 const link=event.target.closest('a[href^="#"]');if(!link||link.id==='skip'||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
 event.preventDefault();navigate(link.getAttribute('href').slice(1));
});
window.addEventListener('popstate',()=>{position=history.state?.manual?history.state.position:0;render()});
window.addEventListener('hashchange',()=>{if(!history.state?.manual){position++;maximum=position;history.replaceState({manual:true,position},'',location.href);}render()});
$('back').onclick=()=>history.back();$('forward').onclick=()=>history.forward();$('home').onclick=()=>navigate('welcome');$('print').onclick=()=>window.print();
$('font-smaller').onclick=()=>{fontSize=Math.max(14,fontSize-1);document.documentElement.style.setProperty('--article-size',fontSize+'px')};
$('font-larger').onclick=()=>{fontSize=Math.min(22,fontSize+1);document.documentElement.style.setProperty('--article-size',fontSize+'px')};
$('search').addEventListener('input',search);$('clear-search').onclick=()=>{$('search').value='';search();$('search').focus()};
$('toc-tab').onclick=()=>showTab(false);$('search-tab').onclick=()=>{showTab(true);$('search').focus()};
document.querySelector('.tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const toSearch=event.key==='End'||(event.key!=='Home'&&$('toc-tab').getAttribute('aria-selected')==='true');showTab(toSearch);$(toSearch?'search-tab':'toc-tab').focus()});
$('expand-all').onclick=()=>{expanded=!expanded;document.querySelectorAll('#toc details').forEach(d=>d.open=expanded);$('expand-all').textContent=expanded?'全部收起':'全部展开'};
$('menu-toggle').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menu-toggle').setAttribute('aria-expanded',String(open))};
$('main').addEventListener('click',closeMenu);$('skip').onclick=event=>{event.preventDefault();$('main').focus()};
document.addEventListener('keydown',event=>{if(event.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){event.preventDefault();if(innerWidth<=760){$('sidebar').classList.add('open');$('menu-toggle').setAttribute('aria-expanded','true')}$('search').focus()}if(event.key==='Escape'){closeMenu()}});
buildTree();render();
</script>
</body>
</html>
