'use strict';
const DATA={"groups":[{"id":"start","title":"开始使用"},{"id":"workspace","title":"工作台"},{"id":"methods","title":"光谱方法"},{"id":"conditions","title":"分析条件"},{"id":"analysis","title":"分析测试"},{"id":"data","title":"数据处理"},{"id":"tools","title":"工具"},{"id":"system","title":"系统管理"},{"id":"help","title":"帮助与故障排查"},{"id":"reference","title":"文件与术语参考"}],"topics":[{"id":"welcome","group":"start","title":"手册首页","lead":"按任务学习，按菜单查阅。","related":["first-run","daily","navigation","files"],"html":"\u003cp>这份手册面向 GeoSpectrum 0.1.0 Windows 桌面版，帮助您从启动软件走到采集、分析、质控和报告输出。\u003c/p>\n\u003ch2>从这里开始\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>第一次使用：\u003c/strong>先阅读\u003ca href=\"#launch\">启动软件\u003c/a>与\u003ca href=\"#login\">创建管理员和登录\u003c/a>，再按\u003ca href=\"#first-run\">首次使用路线\u003c/a>建立工作环境。\u003c/li>\n\u003cli>\u003cstrong>已经有方法：\u003c/strong>按\u003ca href=\"#daily\">日常分析流程\u003c/a>执行样品采集和结果输出。\u003c/li>\n\u003cli>\u003cstrong>按菜单查阅：\u003c/strong>展开左侧目录，八组业务菜单与当前软件对应。\u003c/li>\n\u003cli>\u003cstrong>遇到问题：\u003c/strong>输入“菜单灰色”“标准曲线”“报告”等关键词搜索，或进入\u003ca href=\"#faq-menu\">故障排查\u003c/a>。\u003c/li>\n\u003c/ul>\n\u003ch2>如何浏览\u003c/h2>\n\u003cp>左侧目录支持逐级展开、收起，点击主题后在右侧阅读。正文中的蓝色文字可以跳到相关说明。页面底部提供“上一页 / 下一页”，上方提供阅读历史的“后退 / 前进”。\u003c/p>\n\u003cp>每篇说明尽量按“从哪里进入 → 如何操作 → 完成后检查”的顺序编排。搜索覆盖标题和正文；按 \u003cstrong>/\u003c/strong> 可将焦点移到搜索框。字号按钮调整阅读大小，“打印本页”可打印或另存为 PDF。\u003c/p>\n\u003ch2>适用范围\u003c/h2>\n\u003cp>按 2026-09-05 当前源码、功能清单及同日桌面复验记录编写。当前版本为内部测试版，真实转角与汞灯协议、现场硬件和正式发布验证仍有外部依赖。相关章节会明确说明模拟操作的范围。\u003c/p>\n\u003cp>本手册是独立的离线 HTML 文件，双击后在浏览器中阅读；不需要登录软件、启动服务或联网。它借鉴旧 DIRECT.CHM 的层级目录与主题跳转形式，内容按当前软件重新组织。\u003c/p>\n"},{"id":"launch","group":"start","title":"启动软件与正常退出","lead":"只双击主程序，配套后端由软件管理。","related":["login","faq-start","files"],"html":"\u003cp>项目主文件夹中需要同时保留以下两个文件：\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>GeoSpectrum.exe\u003c/code>：桌面前端和主程序。\u003c/li>\n\u003cli>\u003ccode>geospectrum-backend.exe\u003c/code>：本地后端服务，由主程序自动启动。\u003c/li>\n\u003c/ul>\n\u003cp>两个文件必须放在同一文件夹中，不要单独移动、改名或只复制其中一个。正常使用时只双击 \u003ccode>GeoSpectrum.exe\u003c/code>，不要单独双击后端文件。\u003c/p>\n\u003cp>软件运行数据默认保存在 Windows 当前用户数据目录 \u003ccode>%LOCALAPPDATA%\\cn.geospectrum.desktop\u003c/code>，不会保存在这两个 EXE 旁边。关闭主窗口时，主程序会自动停止本次启动的后端进程。\u003c/p>\n\u003cp>当前版本是未签名内部测试版。Windows 若显示安全提示，请先确认文件来自本项目且哈希未变化，再选择继续运行。当前真实自动转角和汞灯硬件仍缺少现场协议及硬件在环验收，只能使用软件模拟器完成现阶段操作；不要把模拟结果当作真实设备验收结果。\u003c/p>\n\u003ch2>启动步骤\u003c/h2>\n\u003col>\n\u003cli>打开项目主文件夹。\u003c/li>\n\u003cli>双击 \u003ccode>GeoSpectrum.exe\u003c/code>。\u003c/li>\n\u003cli>等待窗口出现。主程序会自动选择一个空闲的本机端口并启动 \u003ccode>geospectrum-backend.exe\u003c/code>。\u003c/li>\n\u003cli>不要关闭或结束后端进程；它由主窗口统一管理。\u003c/li>\n\u003c/ol>\n\u003ch2>正常退出\u003c/h2>\n\u003col>\n\u003cli>先停止正在运行的实时调试、采集或校准任务。\u003c/li>\n\u003cli>等待任务完成或完成安全停止。\u003c/li>\n\u003cli>点击窗口右上角关闭按钮。\u003c/li>\n\u003cli>主窗口关闭后，后端进程会自动退出。\u003c/li>\n\u003c/ol>\n"},{"id":"login","group":"start","title":"创建管理员和登录","related":["users","navigation","faq-password"],"html":"\u003ch2>首次创建管理员\u003c/h2>\n\u003cp>如果本机数据库中还没有账户，界面会显示“初始化本地管理员”。\u003c/p>\n\u003col>\n\u003cli>输入管理员用户名。\u003c/li>\n\u003cli>输入至少 8 位密码。\u003c/li>\n\u003cli>在“确认密码”中再次输入相同密码。\u003c/li>\n\u003cli>点击“创建管理员”。\u003c/li>\n\u003cli>返回登录页后，用刚创建的用户名和密码登录。\u003c/li>\n\u003c/ol>\n\u003cp>软件没有预设通用管理员密码。请妥善保存首次创建的账户信息，不要通过删除数据库的方式处理忘记密码问题。\u003c/p>\n\u003ch2>使用已有账户\u003c/h2>\n\u003col>\n\u003cli>在“登录工作台”输入现有本机用户名和密码。\u003c/li>\n\u003cli>点击“登录”。\u003c/li>\n\u003cli>如果提示“用户名或密码错误”，先检查输入法、大小写及账户是否已被停用。\u003c/li>\n\u003cli>如果页面一直显示账户状态异常，可点击“重新检查账户状态”。\u003c/li>\n\u003c/ol>\n\u003ch2>登录后检查\u003c/h2>\n\u003cp>确认工作台可以打开，顶部显示当前账户。需要切换账户时，使用顶部“退出登录”按钮；采集运行中应先完成安全停止。\u003c/p>\n"},{"id":"first-run","group":"start","title":"首次使用路线","related":["daily","standard-names","faq-report"],"html":"\u003cp>首次使用可分为四个阶段。下面每一项都可以点击打开详细步骤。\u003c/p>\n\u003ch2>1. 建立本机环境\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#login\">启动软件并登录\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#settings\">设置目录、显示和日志\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#overview\">检查本地服务与数据库\u003c/a>。\u003c/li>\n\u003cli>有旧数据时，执行\u003ca href=\"#migrate-methods\">旧方法与配置迁移\u003c/a>；没有旧数据可直接新建方法。\u003c/li>\n\u003c/ol>\n\u003ch2>2. 准备方法与样品\u003c/h2>\n\u003col>\n\u003cli>使用\u003ca href=\"#devices\">设备实时调试\u003c/a>检查模拟采集。\u003c/li>\n\u003cli>需要时建立\u003ca href=\"#dispersion\">色散校准\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#method-create\">新建方法\u003c/a>，设置\u003ca href=\"#conditions\">方法参数\u003c/a>、\u003ca href=\"#lines\">分析谱线\u003c/a>与\u003ca href=\"#standard-names\">标准点名称\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#method-publish\">预览、发布并设为当前\u003c/a>。\u003c/li>\n\u003cli>建立\u003ca href=\"#queue\">样品队列\u003c/a>，核对重复次数。\u003c/li>\n\u003c/ol>\n\u003ch2>3. 采集、分析与质控\u003c/h2>\n\u003col>\n\u003cli>为标准样和未知样分别\u003ca href=\"#capture-create\">创建采集任务\u003c/a>，并\u003ca href=\"#capture-run\">完成全部采集\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#spectra\">查看谱图\u003c/a>，检查样号、峰位和重复数据。\u003c/li>\n\u003cli>\u003ca href=\"#analysis\">定量分析与慢进\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#quality\">重复性质控\u003c/a> → \u003ca href=\"#curves\">标准曲线\u003c/a> → \u003ca href=\"#results\">合并样品结果\u003c/a>。\u003c/li>\n\u003c/ol>\n\u003ch2>4. 输出与保留记录\u003c/h2>\n\u003col>\n\u003cli>\u003ca href=\"#reports\">建立、预览并确认报告\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#exports\">选择输出格式并保存\u003c/a>。\u003c/li>\n\u003cli>\u003ca href=\"#backup\">创建在线备份并校验\u003c/a>。\u003c/li>\n\u003cli>正常关闭主窗口。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>完成标志：\u003c/strong>报告来源可追溯到方法版本、采集数据与曲线快照，输出文件可打开，备份校验通过。单独完成“分析运行”还不等于已经得到可输出的最终报告。\u003c/p>\n"},{"id":"daily","group":"start","title":"日常分析流程","related":["first-run","capture-run","reports"],"html":"\u003cp>首次设置和方法发布完成后，日常操作可以按以下顺序进行：\u003c/p>\n\u003col>\n\u003cli>启动 \u003ccode>GeoSpectrum.exe\u003c/code> 并登录。\u003c/li>\n\u003cli>在工作台确认本地服务在线、当前方法正确且未暂停。\u003c/li>\n\u003cli>建立或选择样品队列。\u003c/li>\n\u003cli>为标准样和未知样分别建立采集任务并完成全部重复采集。\u003c/li>\n\u003cli>在谱图查看中快速检查峰位、异常曲线和样品名称。\u003c/li>\n\u003cli>建立分析运行，完成慢进检查点。\u003c/li>\n\u003cli>完成重复质控。\u003c/li>\n\u003cli>检查标准点、重新拟合并发布每条标准曲线。\u003c/li>\n\u003cli>在样品结果中“合并并保存”。\u003c/li>\n\u003cli>建立报告、预览、确认并导出。\u003c/li>\n\u003cli>创建在线备份并正常关闭软件。\u003c/li>\n\u003c/ol>\n\u003ch2>开始前核对\u003c/h2>\n\u003cul>\n\u003cli>当前方法名称与版本正确，方法未暂停。\u003c/li>\n\u003cli>标准样与未知样的类型、名称和重复次数正确。\u003c/li>\n\u003cli>本轮使用的数据、曲线和报告来源对应同一套方法口径。\u003c/li>\n\u003c/ul>\n\u003ch2>流程跳转\u003c/h2>\n\u003cp>\u003ca href=\"#queue\">样品队列\u003c/a> → \u003ca href=\"#capture-create\">创建采集\u003c/a> → \u003ca href=\"#capture-run\">执行采集\u003c/a> → \u003ca href=\"#analysis\">分析\u003c/a> → \u003ca href=\"#quality\">质控\u003c/a> → \u003ca href=\"#curves\">曲线\u003c/a> → \u003ca href=\"#results\">合并结果\u003c/a> → \u003ca href=\"#reports\">报告\u003c/a> → \u003ca href=\"#backup\">备份\u003c/a>。\u003c/p>\n"},{"id":"navigation","group":"workspace","title":"认识界面与菜单","entry":"左侧导航与顶部工具栏","related":["faq-menu","method-publish","users"],"html":"\u003ch2>界面分区\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>左侧导航：\u003c/strong>工作台、光谱方法、分析条件、分析测试、数据处理、工具、系统管理、帮助。\u003c/li>\n\u003cli>\u003cstrong>顶部：\u003c/strong>当前方法、刷新服务状态、退出登录及账户入口。\u003c/li>\n\u003cli>\u003cstrong>中央工作区：\u003c/strong>所选功能的列表、参数、曲线或结果。\u003c/li>\n\u003cli>\u003cstrong>运行消息：\u003c/strong>记录操作结果、告警与错误，排查问题时优先保留原始提示。\u003c/li>\n\u003c/ul>\n\u003ch2>使用层级菜单\u003c/h2>\n\u003cp>将鼠标移到左侧分组可展开右侧子菜单；点击分组可固定展开。选择子项进入对应页面或内部视图，按 Esc 或点击外部区域收起。长菜单可滚动，键盘方向键可辅助切换焦点。\u003c/p>\n\u003ch2>为什么入口不同\u003c/h2>\n\u003cp>\u003cstrong>入口不显示：\u003c/strong>当前账户没有所需权限。\u003cstrong>入口显示但不可用：\u003c/strong>通常尚未选择当前方法、方法已暂停，或页面内还缺少必要输入。先查看禁用原因，不要反复点击。\u003c/p>\n\u003cp>“方法参数”“分析谱线”等入口会打开当前方法的对应视图；“方法库与当前方法”用于先选择、新建或切换方法。后处理和报告页允许先进入，再在页面内选取来源记录。\u003c/p>\n"},{"id":"overview","group":"workspace","title":"工作台概览","entry":"工作台 → 工作台概览","related":["messages","about","faq-service"],"html":"\u003col>\n\u003cli>登录后进入左侧“工作台”。\u003c/li>\n\u003cli>打开“工作台概览”。\u003c/li>\n\u003cli>确认本地服务显示为运行状态。\u003c/li>\n\u003cli>查看当前方法；首次使用时通常显示“请选择已发布方法”。\u003c/li>\n\u003cli>查看最近运行消息。如果出现错误，记下错误码和错误内容。\u003c/li>\n\u003cli>需要进一步确认版本和数据库路径时，进入“帮助 → 关于与诊断”，点击刷新。\u003c/li>\n\u003c/ol>\n\u003cp>左侧导航按权限显示八组入口：工作台、光谱方法、分析条件、分析测试、数据处理、工具、系统管理和帮助。某个入口不可见通常表示当前账户没有对应权限；入口可见但灰色通常表示尚未选择当前方法或当前方法已暂停。\u003c/p>\n\u003ch2>当前版本的显示提示\u003c/h2>\n\u003cp>工作台“服务通道”中的“事件流：待连接”和“桌面壳：构建中”仍有固定文本显示问题，不能仅凭这两项判断桌面程序未启动或采集失败。请结合本地服务“已连接”、REST API 在线状态、\u003ca href=\"#about\">关于与诊断\u003c/a>以及实际任务消息判断。\u003c/p>\n\u003ch2>完成后检查\u003c/h2>\n\u003cp>本地服务已连接、当前方法符合本次任务，近期消息没有未处理错误。服务离线时先按\u003ca href=\"#faq-service\">服务连接排查\u003c/a>处理。\u003c/p>\n"},{"id":"messages","group":"workspace","title":"阅读与保存运行消息","entry":"工作台 → 工作台概览；各任务的运行消息区域","related":["capture-run","faq-evidence","exports"],"html":"\u003ch2>查看消息\u003c/h2>\n\u003cp>在工作台查看运行消息；在采集、校准和分析任务中同时检查本任务的消息或轨迹。区分普通信息、警告和错误，记录发生时间、任务编号、错误码及原始错误说明。\u003c/p>\n\u003ch2>保存证据\u003c/h2>\n\u003cp>需要导出运行消息时使用界面提供的导出入口，在桌面“另存为”对话框中选择位置。保存后核对实际文件名；取消对话框不会产生文件。\u003c/p>\n\u003ch2>出错后怎么做\u003c/h2>\n\u003cp>先确认任务是否已安全停止，再根据提示修正输入、恢复任务或重新建立任务。不要只截取“失败”二字，也不要反复提交同一个无效输入。报告问题时可使用\u003ca href=\"#faq-evidence\">故障信息清单\u003c/a>。\u003c/p>\n"},{"id":"method-create","group":"methods","title":"新建与复制方法","entry":"光谱方法 → 方法库与当前方法","related":["conditions","lines","method-publish"],"html":"\u003col>\n\u003cli>点击“新建方法”。\u003c/li>\n\u003cli>输入方法名称并确认。名称要简短，兼容旧格式时应控制在 GB18030 编码 20 字节以内。\u003c/li>\n\u003cli>在方法列表中选中刚建立的草稿。\u003c/li>\n\u003c/ol>\n\u003ch2>复制已有方法\u003c/h2>\n\u003cp>在方法列表中选择参考方法，点击“复制”，输入新名称并确认。复制后先检查新方法的参数、谱线和标准点，再保存与发布。不要仅改名称就假定它适合另一类样品。\u003c/p>\n\u003ch2>下一步\u003c/h2>\n\u003cp>依次完成\u003ca href=\"#conditions\">方法参数\u003c/a>、\u003ca href=\"#lines\">分析谱线\u003c/a>、\u003ca href=\"#method-publish\">预览与发布\u003c/a>。新建草稿不会自动成为当前运行方法。\u003c/p>\n"},{"id":"method-publish","group":"methods","title":"发布、切换与暂停方法","entry":"光谱方法 → 方法库与当前方法","related":["method-create","preview","faq-menu"],"html":"\u003col>\n\u003cli>进入“预览与打印”，核对方法条件、谱线和标准点。\u003c/li>\n\u003cli>需要时设置打印机、纸张、方向、边距和版式，生成预览或导出方法参数 PDF。\u003c/li>\n\u003cli>返回方法操作栏，确认待修正项为 0。\u003c/li>\n\u003cli>点击“发布”。发布后会形成不可变版本。\u003c/li>\n\u003cli>点击“设为当前”。\u003c/li>\n\u003cli>顶部“当前方法”应显示方法名称和已发布版本。\u003c/li>\n\u003c/ol>\n\u003cp>后续修改已发布方法时，系统会建立新草稿；保存草稿不会改变正在运行的已发布版本。必须重新发布并再次设为当前，后续采集才会引用新版本。\u003c/p>\n\u003ch2>暂停、恢复与删除\u003c/h2>\n\u003cp>选择方法后，通过“暂停方法”或“恢复方法”图标改变启用状态。暂停当前方法后，依赖它的入口会变为不可用。软删除会要求确认，历史版本仍保留以支持已有数据追溯。\u003c/p>\n\u003ch2>容易混淆的状态\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>列表选中：\u003c/strong>正在查看或编辑这条方法。\u003c/li>\n\u003cli>\u003cstrong>保存草稿：\u003c/strong>保存编辑内容，不等于发布。\u003c/li>\n\u003cli>\u003cstrong>发布版本：\u003c/strong>产生不可变版本。\u003c/li>\n\u003cli>\u003cstrong>设为当前：\u003c/strong>指定后续相关操作使用的运行方法。\u003c/li>\n\u003c/ul>\n\u003cp>顶部当前方法与列表选中项不一定相同，采集前务必核对。\u003c/p>\n"},{"id":"print-settings","group":"methods","title":"页面与打印机设置","entry":"光谱方法 → 页面与打印机设置","related":["preview","exports"],"html":"\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>进入方法打印设置，选择要输出的方法。\u003c/li>\n\u003cli>核对打印机、纸张、方向、边距和版式。\u003c/li>\n\u003cli>保存相关设置，然后打开\u003ca href=\"#preview\">参数预览与打印\u003c/a>。\u003c/li>\n\u003cli>查看页数、中文、单位、表格边界和分页，再执行打印或 PDF 输出。\u003c/li>\n\u003c/ol>\n\u003ch2>检查要点\u003c/h2>\n\u003cp>页面参数与目标打印机纸张应一致。文件输出与实体打印是不同操作：生成 PDF 成功，不代表打印机已经出纸。需要实体打印时选择可用的 Windows 打印机，并检查打印队列。\u003c/p>\n"},{"id":"conditions","group":"conditions","title":"设置方法参数","entry":"分析条件 → 方法参数","related":["lines","method-publish","interval"],"html":"\u003cp>进入“方法条件”页签：\u003c/p>\n\u003col>\n\u003cli>填写名称、说明和工作类型。\u003c/li>\n\u003cli>选择 CCD 布局、要使用的 CCD 和已发布色散校准。\u003c/li>\n\u003cli>设置采集帧数、暗帧数、重复次数、预激发及其他激发条件。\u003c/li>\n\u003cli>设置 RSD 检查开关、阈值和标准样品相关条件。\u003c/li>\n\u003cli>在“分角度存储区间”中设置角度、保存模式、起始帧和结束帧。\u003c/li>\n\u003cli>只需要平均谱时选择“平均值”模式；需要后续全时区间处理时选择“全时保存”，并确保区间至少包含 2 帧。\u003c/li>\n\u003cli>点击“保存方法草稿”。\u003c/li>\n\u003c/ol>\n\u003ch2>数值输入与保存\u003c/h2>\n\u003cp>输入框可以暂时清空以便重新填写；提交时仍需满足有效范围。出现字段错误时按提示修正，不能把空值当作零值或已保存。采样周期、帧数、重复次数和保存区间会影响采集内容，应在发布前统一核对。\u003c/p>\n\u003cp>入口显示“方法参数”，页面内部对应“方法条件”编辑区域。只改草稿不改变已发布版本。\u003c/p>\n"},{"id":"lines","group":"conditions","title":"配置分析谱线","entry":"分析条件 → 分析谱线","related":["standard-names","conditions","profiles"],"html":"\u003cp>进入“分析谱线”页签：\u003c/p>\n\u003col>\n\u003cli>添加分析线、内标线、定位线等所需谱线。\u003c/li>\n\u003cli>为每条谱线设置元素、波长、CCD、转角、峰值/拟合参数、单位、有效范围和内标关系。\u003c/li>\n\u003cli>确认界面显示该谱线在当前 CCD 和校准范围内可检测。\u003c/li>\n\u003cli>对分析线设置标准点名称和标准值。标准点名称必须与后续标准样品的样品名完全对应，例如方法中使用 \u003ccode>S1\u003c/code>，采集的标准样品也应命名为 \u003ccode>S1\u003c/code>。\u003c/li>\n\u003cli>保存每条谱线，直到方法顶部不再显示待修正项。\u003c/li>\n\u003c/ol>\n\u003ch2>谱线类型\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>分析线：\u003c/strong>参与待测元素定量。\u003c/li>\n\u003cli>\u003cstrong>内标线：\u003c/strong>用于已配置的内标关系。\u003c/li>\n\u003cli>\u003cstrong>定位线：\u003c/strong>辅助谱线定位。\u003c/li>\n\u003cli>\u003cstrong>基线：\u003c/strong>用于方法中的背景/基线相关处理。\u003c/li>\n\u003c/ul>\n\u003cp>波长必须是有效数值且满足检测范围。保存失败时查看字段提示；不要在非法输入后继续发布方法。内标引用、CCD 与校准范围应一致。\u003c/p>\n"},{"id":"standard-names","group":"conditions","title":"标准点与标准样名称对应","entry":"分析条件 → 分析谱线；分析测试 → 标准曲线与样品结果","related":["queue","capture-create","curves","faq-curves"],"html":"\u003ch2>核心规则\u003c/h2>\n\u003cp>方法分析线里的标准点名称，要与采集得到的\u003cstrong>标准样品名称完全对应\u003c/strong>。例如标准点使用 S1、S2、S3、S4，采集时也使用这些名称，并将样品类型设为“标准样”。\u003c/p>\n\u003cp>未知样品使用独立名称，例如 QA-1。不要把未知样品命名为某个标准点，也不要仅靠队列顺序代替名称匹配。\u003c/p>\n\u003ch2>操作检查\u003c/h2>\n\u003col>\n\u003cli>在分析谱线中保存标准点名称和已知标准值。\u003c/li>\n\u003cli>建立队列或采集任务时核对样名、类型和重复次数。\u003c/li>\n\u003cli>完成采集、分析及重复性质控。\u003c/li>\n\u003cli>打开标准点视图，确认每个启用点都能获得有效强度。\u003c/li>\n\u003cli>再拟合并发布标准曲线。\u003c/li>\n\u003c/ol>\n\u003cp>示例名称只用于说明对应规则，不提供通用标准浓度。实际标准值应来自您采用的标准样资料。\u003c/p>\n"},{"id":"preview","group":"conditions","title":"参数预览与打印","entry":"分析条件 → 参数预览与打印","related":["method-publish","print-settings","exports"],"html":"\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>确认当前方法和要查看的版本。\u003c/li>\n\u003cli>进入“参数预览与打印”，检查方法条件、谱线、内标关系与标准点。\u003c/li>\n\u003cli>如需调整版式，进入\u003ca href=\"#print-settings\">页面与打印机设置\u003c/a>。\u003c/li>\n\u003cli>生成预览，检查页数、边距、表格与中文显示。\u003c/li>\n\u003cli>使用方法 PDF 输出或打印入口，并核对保存位置或打印结果。\u003c/li>\n\u003c/ol>\n\u003ch2>发布前检查\u003c/h2>\n\u003cp>预览用于复核，不会替代保存草稿和发布。待修正项为 0 后，仍需在方法操作栏执行“发布”和“设为当前”。\u003c/p>\n"},{"id":"queue","group":"analysis","title":"样号与样品队列","section":"准备与采集","entry":"分析测试 → 样号与样品队列","related":["standard-names","capture-create","formats"],"html":"\u003cp>进入“分析测试 → 样号与样品队列”。\u003c/p>\n\u003col>\n\u003cli>点击“新建队列”。\u003c/li>\n\u003cli>输入队列名称、样品名和重复次数。\u003c/li>\n\u003cli>点击“创建队列”。\u003c/li>\n\u003cli>继续输入其他样品，点击“插入样品”。\u003c/li>\n\u003cli>核对样品顺序、预录名称、重复次数和展开谱带数。\u003c/li>\n\u003cli>如果已有旧 \u003ccode>.sam\u003c/code> 文件，可点击“导入 SAM”；导入后仍应核对名称和重复次数。\u003c/li>\n\u003cli>需要交换队列时可点击“导出 SAM”并选择保存位置。\u003c/li>\n\u003c/ol>\n\u003cp>用于标准曲线的标准样品名称必须与方法分析线中的标准点名称一致。普通未知样品应使用不会与标准点重名的名称。\u003c/p>\n"},{"id":"dispersion","group":"analysis","title":"色散摄谱与校准","section":"准备与采集","entry":"分析测试 → 色散摄谱与校准","related":["devices","conditions","mercury"],"html":"\u003cp>如果已有适用的已发布色散校准，可跳到第 6 步。\u003c/p>\n\u003cp>进入“分析测试 → 色散摄谱与校准”。\u003c/p>\n\u003col>\n\u003cli>选择设备档案和 CCD 布局。\u003c/li>\n\u003cli>设置燃烧帧和暗帧数量。\u003c/li>\n\u003cli>点击“新建任务”，再点击“开始”。\u003c/li>\n\u003cli>可使用连续运行，也可使用“单帧”逐帧检查；需要时使用“暂停”“继续”或“停止”安全收尾。\u003c/li>\n\u003cli>在“谱线定位与位置”中输入元素、已知波长和 CCD，点击“添加”。\u003c/li>\n\u003cli>至少准备 3 个有效定位点，采集到帧后点击“全部定位”，必要时逐项核对位置。\u003c/li>\n\u003cli>输入校准名称，点击“二次拟合”。\u003c/li>\n\u003cli>检查有效波段、RMS、最大残差和是否允许发布。\u003c/li>\n\u003cli>校准可发布时点击“发布版本”。\u003c/li>\n\u003cli>需要时在“绑定已发布方法修订”中选择方法并点击“绑定修订”。\u003c/li>\n\u003c/ol>\n\u003cp>色散原始帧和已发布校准版本不可原地修改。残差超限时应检查定位点，不要强行把不可发布草稿用于正式方法。\u003c/p>\n"},{"id":"capture-create","group":"analysis","title":"创建蒸发或样品采集任务","section":"准备与采集","entry":"分析测试 → 蒸发与样品摄谱","related":["capture-run","queue","standard-names"],"html":"\u003col>\n\u003cli>任务类型选择“样品摄谱”；只有专门采集蒸发全时数据时才选择“蒸发摄谱”。\u003c/li>\n\u003cli>输入任务名称。\u003c/li>\n\u003cli>选择设备档案和 CCD 布局。\u003c/li>\n\u003cli>选择正确的已发布方法版本。\u003c/li>\n\u003cli>选择样品队列和预录样品；不使用队列时填写临时样号并选择样品类型。\u003c/li>\n\u003cli>标准点样品选择“标准样”，未知样品选择“试样”或“普通样”，空白选择“空样”。\u003c/li>\n\u003cli>选择“平均值 float32”或“全时原始区间”保存模式。\u003c/li>\n\u003cli>设置燃烧帧、暗帧、重复次数、倒计时、预激发、采样周期、模拟帧和随机种子。\u003c/li>\n\u003cli>点击“创建任务”。\u003c/li>\n\u003c/ol>\n\u003ch2>创建后检查\u003c/h2>\n\u003cp>任务列表出现新任务，方法版本、样品类型、保存模式与重复次数正确。创建任务不等于已经采集，下一步选中任务并启动。\u003c/p>\n"},{"id":"capture-run","group":"analysis","title":"执行、暂停与停止采集","section":"准备与采集","entry":"分析测试 → 蒸发与样品摄谱","related":["spectra","analysis","messages"],"html":"\u003col>\n\u003cli>在左侧任务列表中选中任务。\u003c/li>\n\u003cli>点击“开始”。\u003c/li>\n\u003cli>点击“连续采集”让模拟任务自动推进；需要逐步检查时使用“单步”。\u003c/li>\n\u003cli>观察总进度、当前阶段、燃烧帧/暗帧数量、CCD 曲线、峰值和帧哈希。\u003c/li>\n\u003cli>需要中断检查时使用“暂停”，确认后点“继续”。\u003c/li>\n\u003cli>发生异常时使用停止按钮进行安全收尾，不要强制结束后端进程。\u003c/li>\n\u003cli>等待任务状态变为“已完成”，并确认“结果”为“已收尾”。\u003c/li>\n\u003cli>如果任务使用临时样号，可在“采集后命名”输入正式样号并点击“保存名称”。\u003c/li>\n\u003cli>查看“全部采集消息”，确认没有未处理的错误或警告。\u003c/li>\n\u003c/ol>\n\u003cp>同一个标准样或未知样需要重复测量时，应让重复次数来自队列或任务设置，不要把一次未完成任务当作完整重复组。\u003c/p>\n"},{"id":"hardware","group":"analysis","title":"自动转角采集与异常处置","section":"准备与采集","entry":"分析测试 → 自动转角采集","related":["devices","capture-run","hardware-limit"],"html":"\u003ch2>当前可用范围\u003c/h2>\n\u003cp>该页面提供转角计划和异常处置的软件流程。真实转角协议与现场证据尚缺，真实串口档案启动会记录延后状态，不发送猜测命令。以下用于模拟检查，不作为真实设备操作规程。\u003c/p>\n\u003ch2>模拟操作步骤\u003c/h2>\n\u003col>\n\u003cli>选择已发布当前方法，进入“自动转角采集”。\u003c/li>\n\u003cli>填写任务名称，选择模拟设备档案和 CCD 布局。\u003c/li>\n\u003cli>按本次模拟方案选择“短波 → 长波”或“关键波段优先”，设置异常策略及有限重试上限。\u003c/li>\n\u003cli>核对页面中的转角计划与波段内容，点击“创建任务”。计划输入需要符合界面和方法约束；不要把测试脚本当作真实串口命令。\u003c/li>\n\u003cli>选中任务，点击“启动”，通过“单步”检查进度、当前计划步、原始帧和轨迹。\u003c/li>\n\u003cli>发生人工接管时，先检查当前帧和失败原因，再选择接受、重试、恢复或停止；损坏帧不能被接受。\u003c/li>\n\u003cli>结束后检查处置决定、结果和安全收尾记录。\u003c/li>\n\u003c/ol>\n\u003ch2>真实设备前置条件\u003c/h2>\n\u003cp>必须先取得已确认的现场协议和硬件验收条件，再安排真实采集；不能通过修改异常策略绕过缺失条件。\u003c/p>\n"},{"id":"spectra","group":"analysis","title":"谱图查看、叠加与定位","section":"查看与分析","entry":"分析测试 → 谱图查看","related":["capture-run","analysis","exports","interval"],"html":"\u003cp>进入“分析测试 → 谱图查看”。\u003c/p>\n\u003col>\n\u003cli>点击“刷新”，选择刚完成的谱图记录。\u003c/li>\n\u003cli>可勾选 1 至 8 个原始样品进行叠加。\u003c/li>\n\u003cli>选择转角、CCD 或谱线，使用“上一条/下一条”切换。\u003c/li>\n\u003cli>使用十字线、滚动、框选、横向/纵向缩放检查峰位和强度。\u003c/li>\n\u003cli>需要定位时输入波长或点位，点击“定位并锁定”。\u003c/li>\n\u003cli>全时数据可设置曝光区间，也可读取指定 burn/dark 原始帧。\u003c/li>\n\u003cli>导出前确认样品、转角、CCD、曝光区间和当前可见范围。\u003c/li>\n\u003cli>点击“导出可见范围”保存数据，或点击“打印 PDF”保存当前视图。\u003c/li>\n\u003c/ol>\n\u003cp>“参考校正”只影响当前查看和输出口径；需要形成正式校准时应回到色散校准流程。\u003c/p>\n"},{"id":"analysis","group":"analysis","title":"定量分析与逐谱线慢进","section":"查看与分析","entry":"分析测试 → 定量分析与慢进","related":["profiles","quality","faq-analysis"],"html":"\u003cp>进入“分析测试 → 定量分析与慢进”。\u003c/p>\n\u003col>\n\u003cli>输入分析批次名称。\u003c/li>\n\u003cli>选择计算档案：\u003cul>\n\u003cli>\u003ccode>modern_v1\u003c/code>：现代高斯面积定量。\u003c/li>\n\u003cli>\u003ccode>legacy_2_0_2\u003c/code>：旧版峰高计算口径。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>根据需要启用“逐谱线慢进”，并设置慢进超时。\u003c/li>\n\u003cli>勾选已完成采集的样品。同一批次只能使用同一个方法版本的样品。\u003c/li>\n\u003cli>点击“建立并锁定输入”。\u003c/li>\n\u003cli>点击“开始”。\u003c/li>\n\u003cli>如果启用了慢进，出现检查点时查看峰位周边谱图：\u003cul>\n\u003cli>自动峰位正确：可保持当前峰位并点击“接受调整”。\u003c/li>\n\u003cli>需要人工修正：输入调整后峰位和理由，再点击“接受调整”。\u003c/li>\n\u003cli>不采用人工调整：点击“放弃调整”，系统使用自动定位结果。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>点击“推进一条谱线”，重复处理后续检查点，直到分析状态为“已完成”。\u003c/li>\n\u003cli>在“原始结果”检查峰位、峰高、背景、Sigma、面积和定量信号。\u003c/li>\n\u003c/ol>\n\u003cp>人工峰位调整、理由、输入哈希和最终结果都会写入审计记录。\u003c/p>\n"},{"id":"quality","group":"analysis","title":"重复性质控","section":"质控、曲线与结果","entry":"分析测试 → 重复性质控","related":["analysis","curves","results"],"html":"\u003col>\n\u003cli>打开“重复性质控”视图。\u003c/li>\n\u003cli>查看均值、极差、标准差、RSD、ID 和有效次数。\u003c/li>\n\u003cli>有警告时，先检查各次重复值。\u003c/li>\n\u003cli>可以“接受提示”，也可以剔除明显异常重复；误剔除时点击“恢复”。\u003c/li>\n\u003cli>点击“重新统计”，确认质控快照显示“可用于拟合”。\u003c/li>\n\u003c/ol>\n\u003ch2>完成后检查\u003c/h2>\n\u003cp>确认有效重复次数、提示接受与剔除决定正确，再重新统计形成可用快照。不要为了让曲线可发布而无依据地剔除数据。\u003c/p>\n"},{"id":"curves","group":"analysis","title":"拟合并发布标准曲线","section":"质控、曲线与结果","entry":"分析测试 → 标准曲线与样品结果","related":["standard-names","quality","results","faq-curves"],"html":"\u003col>\n\u003cli>打开“标准点”视图，确认每个标准点都找到了同名标准样品并显示原始强度。\u003c/li>\n\u003cli>必要时停用异常标准点，或保存修正强度；所有修正都需要留下明确理由。\u003c/li>\n\u003cli>打开“曲线图”视图。\u003c/li>\n\u003cli>选择拟合方式：直线、二次、三次或样条。\u003c/li>\n\u003cli>选择普通坐标或对数坐标。\u003c/li>\n\u003cli>点击“重新拟合”。\u003c/li>\n\u003cli>检查相关系数、RMSE、标准点残差以及曲线是否可发布。\u003c/li>\n\u003cli>可使用图像预览、文本预览或打印 PDF 复核。\u003c/li>\n\u003cli>确认后点击“发布快照”。每条分析谱线都要发布一个有效曲线快照。\u003c/li>\n\u003c/ol>\n"},{"id":"results","group":"analysis","title":"合并并保存样品结果","section":"质控、曲线与结果","entry":"分析测试 → 标准曲线与样品结果 → 样品结果","related":["curves","reports","faq-report"],"html":"\u003col>\n\u003cli>打开“样品结果”视图。\u003c/li>\n\u003cli>确认所有分析谱线都已有已发布曲线快照。\u003c/li>\n\u003cli>检查样品的有效次数、均值强度、分析值和单位。\u003c/li>\n\u003cli>点击“合并并保存”。\u003c/li>\n\u003cli>记录合并快照编号和结果哈希。报告应使用这个最终合并结果。\u003c/li>\n\u003c/ol>\n\u003ch2>为什么还要合并\u003c/h2>\n\u003cp>分析运行中的原始结果、曲线拟合结果和最终报告来源是不同阶段。只有完成相应质控与曲线发布，再“合并并保存”，报告才有可追溯的最终结果可用。\u003c/p>\n"},{"id":"interval","group":"data","title":"全时区间处理","entry":"数据处理 → 全时区间处理","related":["spectra","recalculate","formats"],"html":"\u003ch2>开始前\u003c/h2>\n\u003cp>选择确实保存了全时帧的记录。只有平均谱的记录不能凭空恢复每一帧。采集时是否保存全时数据，参见\u003ca href=\"#conditions\">方法参数\u003c/a>和\u003ca href=\"#capture-create\">采集任务\u003c/a>。\u003c/p>\n\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>进入“全时区间处理”，选择 EDT/CMT 或支持的全时采集记录。\u003c/li>\n\u003cli>核对 CCD，设置起始帧和结束帧后读取区间。\u003c/li>\n\u003cli>检查所选区间的曲线、来源与范围。\u003c/li>\n\u003cli>需要进行 EDT 转换时，明确选择记录、目标 CCD 布局和方法版本，再执行转换。\u003c/li>\n\u003cli>核对处理记录和结果信息；原件保持只读。\u003c/li>\n\u003c/ol>\n\u003ch2>常见限制\u003c/h2>\n\u003cp>缺少原始帧、区间越界或布局不匹配时应修正选择，不要通过改文件扩展名绕过校验。\u003c/p>\n"},{"id":"recalculate","group":"data","title":"结果重算与矩阵导出","entry":"数据处理 → 结果重算与矩阵导出","related":["profiles","curves","migrate-results","exports"],"html":"\u003ch2>明确输入\u003c/h2>\n\u003cp>精确重算需要源记录、确切方法版本、计算档案和已发布曲线快照。先确定这些绑定，再执行；同名方法不能代替版本一致性。\u003c/p>\n\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>进入“结果重算与矩阵导出”，选择来源记录。\u003c/li>\n\u003cli>选择目标方法版本、计算档案和适用的已发布曲线快照。\u003c/li>\n\u003cli>执行重算，检查处理状态和结果；任一来源失败时，先修正阻断原因再重试整批。\u003c/li>\n\u003cli>选择要输出的原始强度、处理强度或结果矩阵。\u003c/li>\n\u003cli>选择 TXT、CSV 或 Excel 格式，填写已存在且可写的输出目录与文件名。\u003c/li>\n\u003cli>导出后按界面返回的最终路径检查文件。\u003c/li>\n\u003c/ol>\n\u003cp>旧结果只读迁移与精确重算是两个步骤。导入成功不代表已经具备所有重算条件。\u003c/p>\n"},{"id":"reports","group":"data","title":"建立、确认与输出分析报告","entry":"数据处理 → 分析报告","related":["results","exports","faq-report"],"html":"\u003cp>进入“数据处理 → 分析报告”。\u003c/p>\n\u003col>\n\u003cli>在“分析运行”中勾选已完成的分析批次。\u003c/li>\n\u003cli>可填写报告编号；留空时由系统生成。\u003c/li>\n\u003cli>选择报告模板。\u003c/li>\n\u003cli>选择“常规排列”或“交换排列”。\u003c/li>\n\u003cli>需要时填写样品筛选和元素筛选。\u003c/li>\n\u003cli>点击“建立报告版本”。\u003c/li>\n\u003cli>在报告版本列表中选中刚建立的草稿。\u003c/li>\n\u003cli>点击“预览”，核对样品、元素、方法版本、计算档案、质控状态和结果。\u003c/li>\n\u003cli>关闭预览后点击“确认报告”。确认后才能作为正式输出来源。\u003c/li>\n\u003cli>在“格式与输出”输入完整输出目录和文件名。\u003c/li>\n\u003cli>选择 Windows 打印机；只需要文件时可保留默认虚拟 PDF 打印机。\u003c/li>\n\u003cli>点击“文本”“CSV”“Excel”“PDF”或“打印”。\u003c/li>\n\u003cli>根据顶部提示确认最终保存路径。\u003c/li>\n\u003c/ol>\n\u003cp>同名输出采用自动加后缀策略，不会静默覆盖已有报告。\u003c/p>\n"},{"id":"exports","group":"data","title":"文件保存、导出与打印","entry":"各页面的保存、导出或打印入口","related":["reports","print-settings","spectra","queue"],"html":"\u003ch2>两种保存方式\u003c/h2>\n\u003cp>\u003cstrong>弹出“另存为”对话框：\u003c/strong>常见于运行消息、方法 PDF、谱图 CSV/PDF、SAM 队列等前端生成的文件。选择位置并确认保存；取消不会产生文件。浏览器开发模式使用浏览器下载行为。\u003c/p>\n\u003cp>\u003cstrong>页面内填写输出目录：\u003c/strong>报告和后处理矩阵使用对应页面的目录与文件名设置。先确认目录已存在、可写，再导出，以成功提示中的实际路径为准。\u003c/p>\n\u003ch2>选择格式\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>需要做什么\u003c/th>\n\u003cth>常用格式与入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>查看和提交排版结果\u003c/td>\n\u003ctd>报告 PDF、方法 PDF、谱图 PDF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>继续整理表格数据\u003c/td>\n\u003ctd>报告或矩阵 CSV / Excel\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>简单文本交换\u003c/td>\n\u003ctd>报告或矩阵 TXT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交换样品队列\u003c/td>\n\u003ctd>样品队列 SAM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保存故障上下文\u003c/td>\n\u003ctd>运行消息 LOG\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>输出前后检查\u003c/h2>\n\u003col>\n\u003cli>确认方法版本、样品、元素、CCD 和所选范围。\u003c/li>\n\u003cli>报告先预览并确认；方法和谱图按当前预览或可见范围输出。\u003c/li>\n\u003cli>执行保存，等待明确的成功提示。\u003c/li>\n\u003cli>打开最终文件检查内容和文件名。同名文件可能增加后缀，应记录实际路径。\u003c/li>\n\u003c/ol>\n\u003cp>实体打印还需选择可用 Windows 打印机并检查打印队列。不要把生成 PDF 与纸张已打印混为一谈。\u003c/p>\n"},{"id":"devices","group":"tools","title":"设备参数与实时调试","entry":"工具 → 设备参数与实时调试","related":["dispersion","capture-create","hardware-limit"],"html":"\u003cp>进入“工具 → 设备参数与实时调试”。\u003c/p>\n\u003col>\n\u003cli>在“当前档案”选择 ACQ 模拟器设备档案。\u003c/li>\n\u003cli>核对 CCD 布局、点数和保护时间。\u003c/li>\n\u003cli>点击“连接诊断”，确认适配器状态变为已连接。\u003c/li>\n\u003cli>选择模拟样本、随机种子和要查看的 CCD。\u003c/li>\n\u003cli>点击“开始”，观察实时曲线、峰值、峰位、帧序和帧哈希。\u003c/li>\n\u003cli>可使用十字线、横向放大、缩小、100%、400% 和还原视图。\u003c/li>\n\u003cli>检查完成后依次点击“停止”和“断开”。\u003c/li>\n\u003c/ol>\n\u003cp>实时调试不会生成样品或谱图记录，界面中的“记录写入”应保持为 \u003ccode>0 样品 · 0 谱图\u003c/code>。\u003c/p>\n"},{"id":"mercury","group":"tools","title":"汞灯与光学校准","entry":"工具 → 汞灯与光学校准","related":["dispersion","devices","hardware-limit"],"html":"\u003ch2>与色散校准的区别\u003c/h2>\n\u003cp>汞灯页面比较汞线的期望位置与实测峰位，生成光学偏移建议及版本记录；结果独立于色散方法版本。不要把“应用建议”当作重新发布色散曲线。\u003c/p>\n\u003ch2>模拟检查步骤\u003c/h2>\n\u003col>\n\u003cli>进入“汞灯与光学校准”，输入会话名称。\u003c/li>\n\u003cli>选择模拟设备档案、CCD 布局及汞线，核对稳定帧数与模拟峰偏移；正常流程的故障脚本选“无”。\u003c/li>\n\u003cli>点击“建立校准会话”，选中会话后“启动”，通过“单步”推进到稳定采集阶段。\u003c/li>\n\u003cli>查看实时汞谱、期望位置、实测位置、校正前后偏移和残差 RMS。\u003c/li>\n\u003cli>仅在状态允许且结果经复核后使用“应用建议”；需要撤销时按页面提供的“回滚”恢复版本。\u003c/li>\n\u003cli>结束后确认安全态及调试轨迹；异常安全关闭的会话不应作为已应用校准。\u003c/li>\n\u003c/ol>\n\u003ch2>当前限制\u003c/h2>\n\u003cp>真实汞灯协议、抓包与现场硬件仍缺失。选择真实档案可能进入延后状态，不会发送猜测的控制字节。本节是软件模拟流程，真实汞灯的开关、预热和保护时间必须以设备确认资料为依据。\u003c/p>\n"},{"id":"migrate-methods","group":"tools","title":"旧方法与配置迁移","section":"旧版数据迁移","entry":"工具 → 旧方法与配置迁移","related":["method-publish","formats","migrate-spectra"],"html":"\u003cp>进入“工具 → 旧方法与配置迁移”。\u003c/p>\n\u003col>\n\u003cli>确认“Jet 读取器就绪”。读取器不可用只会阻止旧方法迁移，不影响新建方法和日常分析。\u003c/li>\n\u003cli>分别输入旧版 \u003ccode>DIRECT.MTD\u003c/code>、\u003ccode>DIRECT.CFG\u003c/code>、\u003ccode>DIRECT.OPT\u003c/code> 的完整路径。\u003c/li>\n\u003cli>点击“只读暂存并校验”。\u003c/li>\n\u003cli>检查迁移报告中的方法数、谱线数、色散曲线数、源文件 SHA-256 和全部一致性检查。\u003c/li>\n\u003cli>确认报告无阻断问题后，点击“原子提交”。\u003c/li>\n\u003c/ol>\n\u003ch2>数据保护\u003c/h2>\n\u003cp>原始 MTD、CFG、OPT 保持只读。先检查暂存报告再提交，读取器失败时保存诊断，不通过修改历史原件解决。迁移后检查方法草稿与已发布状态，再选择适合的当前方法。\u003c/p>\n"},{"id":"migrate-spectra","group":"tools","title":"旧谱数据迁移","section":"旧版数据迁移","entry":"工具 → 旧谱数据迁移","related":["formats","spectra","interval"],"html":"\u003ch2>支持的文件\u003c/h2>\n\u003cp>本入口处理 CDT、CMT、EDT、WDT 旧谱数据。DAT/PDT 结果文件使用\u003ca href=\"#migrate-results\">旧结果迁移\u003c/a>，SAM 使用\u003ca href=\"#queue\">样品队列\u003c/a>导入。\u003c/p>\n\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>选择旧谱文件，执行暂存与校验。\u003c/li>\n\u003cli>检查格式、CCD 布局、记录数、数据块、坏帧和源文件指纹。\u003c/li>\n\u003cli>报告无阻断问题后原子提交。\u003c/li>\n\u003cli>到\u003ca href=\"#spectra\">谱图查看\u003c/a>核对样品和曲线；全时数据需要时进入\u003ca href=\"#interval\">全时区间处理\u003c/a>。\u003c/li>\n\u003c/ol>\n\u003cp>解析在临时副本中进行，原件不回写。遇到未知格式、截断或损坏数据，应保留原件和报告，不更改扩展名来尝试导入。\u003c/p>\n"},{"id":"migrate-results","group":"tools","title":"旧结果迁移","section":"旧版数据迁移","entry":"工具 → 旧结果迁移","related":["formats","recalculate","migrate-methods"],"html":"\u003ch2>操作步骤\u003c/h2>\n\u003col>\n\u003cli>在旧结果迁移页选择 DAT 或 PDT 文件。\u003c/li>\n\u003cli>执行只读暂存和校验。\u003c/li>\n\u003cli>检查样品、谱线、矩阵维度、方法匹配状态和源文件指纹。\u003c/li>\n\u003cli>无阻断问题后原子提交，核对迁移后的记录。\u003c/li>\n\u003c/ol>\n\u003ch2>方法匹配与后续使用\u003c/h2>\n\u003cp>无法匹配方法的结果应保留其来源和诊断，不要随意套用同名方法。精确重算还需指定确切方法版本、计算档案和已发布曲线快照，详见\u003ca href=\"#recalculate\">重算与矩阵导出\u003c/a>。\u003c/p>\n\u003cp>只读迁移不会覆盖旧 DAT/PDT，也不会把重新计算的结果写回旧格式。\u003c/p>\n"},{"id":"settings","group":"system","title":"软件设置","entry":"系统管理 → 软件设置","related":["files","backup","exports"],"html":"\u003cp>进入“系统管理 → 软件设置”。\u003c/p>\n\u003col>\n\u003cli>在“默认目录”中设置数据、方法、样品、导出和备份目录。\u003c/li>\n\u003cli>建议把导出和备份放到项目主文件夹之外，例如 \u003ccode>C:\\Users\\Leo\\Documents\\GeoSpectrum\u003c/code>。\u003c/li>\n\u003cli>选择浅色或深色主题，以及舒适或紧凑信息密度。\u003c/li>\n\u003cli>一般使用“信息”日志级别；排查问题时再临时改为“调试”。\u003c/li>\n\u003cli>设置日志保留天数和日志大小上限。\u003c/li>\n\u003cli>设置默认纸张、时区以及是否打印前预览。\u003c/li>\n\u003cli>点击“保存设置”。\u003c/li>\n\u003c/ol>\n\u003cp>“恢复默认”会恢复设置草稿；确认无误后仍应点击“保存设置”。\u003c/p>\n\u003ch2>目录含义\u003c/h2>\n\u003cp>默认业务目录和导出目录不等于 SQLite 数据库位置。修改默认目录不会搬迁数据库；实际数据库路径以“关于与诊断”为准。保存后重新检查设置值，错误提示未消失前不要认为已经生效。\u003c/p>\n"},{"id":"users","group":"system","title":"用户与权限","entry":"系统管理 → 用户与权限","related":["login","faq-menu","faq-password","audit"],"html":"\u003ch2>账户和角色\u003c/h2>\n\u003cp>系统内置系统管理员、方法管理员、分析员、只读审计员等角色。管理员主要负责本机设置与身份管理，方法管理员负责方法配置，分析员执行分析流程，只读审计员查阅已授权记录。角色名称不等于拥有全部业务操作权限，以页面实际列出的权限为准。\u003c/p>\n\u003ch2>新建账户\u003c/h2>\n\u003col>\n\u003cli>使用具备用户管理权限的账户进入本页。\u003c/li>\n\u003cli>在创建用户区域填写用户名、至少 8 位的初始密码及角色。\u003c/li>\n\u003cli>点击创建按钮，刷新后核对账户列表、角色和启用状态。\u003c/li>\n\u003cli>新账户登录后检查所需入口是否可见。\u003c/li>\n\u003c/ol>\n\u003ch2>启用与停用\u003c/h2>\n\u003cp>在账户列表中对其他账户使用启用/停用按钮。当前界面不提供停用自身账户的操作。停用影响后续访问，不删除其历史操作记录。\u003c/p>\n\u003ch2>角色维护的边界\u003c/h2>\n\u003cp>本页可以查看角色权限，具备权限时可创建自定义角色。当前界面没有完整的既有用户角色改配或密码重置表单；不要按旧软件菜单寻找不存在的“重置密码”按钮。需要这些操作时联系维护人员，先保护现有数据。\u003c/p>\n"},{"id":"audit","group":"system","title":"审计记录","entry":"系统管理 → 审计记录","related":["users","messages","faq-evidence"],"html":"\u003ch2>查阅步骤\u003c/h2>\n\u003col>\n\u003cli>进入“审计记录”，点击“刷新”。\u003c/li>\n\u003cli>按时间倒序查看记录，核对操作者、动作、目标和详情。\u003c/li>\n\u003cli>对需要进一步解释的详情使用展开控件，记录对应时间及对象编号。\u003c/li>\n\u003c/ol>\n\u003ch2>与运行消息的区别\u003c/h2>\n\u003cp>运行消息主要帮助理解当前运行情况；审计用于追溯身份、方法、采集、分析、输出和维护等变更。审计记录不可在本页任意编辑或删除。\u003c/p>\n\u003cp>当前桌面审计页以刷新和倒序列表为主，没有独立的日期/动作筛选表单。查找大量记录时不要把其他页面的搜索功能当作本页筛选能力。\u003c/p>\n"},{"id":"backup","group":"system","title":"在线备份与恢复演练","entry":"系统管理 → 备份与维护","related":["maintenance","files","faq-password"],"html":"\u003cp>进入“系统管理 → 备份与维护”。\u003c/p>\n\u003col>\n\u003cli>确认数据库状态为“数据库正常”，外键错误为 0。\u003c/li>\n\u003cli>输入项目主文件夹之外的备份目录。\u003c/li>\n\u003cli>点击“创建备份”。\u003c/li>\n\u003cli>在备份记录中点击“校验”。\u003c/li>\n\u003cli>定期点击“恢复演练”，确认备份可以在隔离副本中恢复。\u003c/li>\n\u003cli>根据需要执行 WAL checkpoint、优化、受控回收和过期日志/临时文件清理。\u003c/li>\n\u003c/ol>\n\u003cp>不要在软件运行时直接复制 SQLite 主数据库来代替在线备份。\u003c/p>\n\u003ch2>恢复演练的含义\u003c/h2>\n\u003cp>“恢复演练”在隔离副本中验证备份，不会直接把当前业务库切换为旧备份。演练成功后，当前库仍是原来的库。需要正式恢复时，先与维护人员确认恢复范围及切换步骤。\u003c/p>\n\u003cp>备份应放在合适的独立目录，并定期确认文件可读取、校验通过。不要为了重置账户而删除业务数据库。\u003c/p>\n"},{"id":"maintenance","group":"system","title":"数据库、日志与临时文件维护","entry":"系统管理 → 备份与维护","related":["backup","audit","files"],"html":"\u003ch2>执行前检查\u003c/h2>\n\u003cp>确认有维护权限，近期在线备份已校验，当前没有需要继续运行的采集任务。查看数据库状态和外键检查结果，先处理异常再安排维护。\u003c/p>\n\u003ch2>可用操作\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>WAL checkpoint：\u003c/strong>处理数据库事务日志的检查点。\u003c/li>\n\u003cli>\u003cstrong>优化：\u003c/strong>执行数据库维护优化。\u003c/li>\n\u003cli>\u003cstrong>受控回收：\u003c/strong>按程序约束回收数据库空间，不代表删除业务结果。\u003c/li>\n\u003cli>\u003cstrong>日志与临时文件清理：\u003c/strong>按保留策略清理程序管理的相应文件。\u003c/li>\n\u003c/ul>\n\u003cp>每次执行后检查页面结果和操作记录。维护失败时保留错误信息，不直接在资源管理器中删除正在使用的数据库、WAL 或备份。\u003c/p>\n"},{"id":"builtin-help","group":"help","title":"软件内的离线帮助","entry":"帮助 → 离线帮助","related":["faq-evidence","navigation","about"],"html":"\u003ch2>使用方式\u003c/h2>\n\u003cp>登录后进入“帮助 → 离线帮助”，在搜索框输入主题、关键词或错误码，选择左侧匹配主题阅读简要说明。清空搜索可恢复主题列表。\u003c/p>\n\u003ch2>与本手册的关系\u003c/h2>\n\u003cp>软件内帮助是当前内置的简要主题页；本文件提供更细的操作步骤、树形目录及正文跳转。软件内“关联模块”当前显示模块路径文本，并非本手册的可点击导航。\u003c/p>\n\u003cp>查找具体操作时可在本手册搜索框中输入“样品队列”“合并”“报告”等词。\u003c/p>\n"},{"id":"about","group":"help","title":"关于与诊断","entry":"帮助 → 关于与诊断","related":["overview","files","faq-evidence"],"html":"\u003ch2>查看内容\u003c/h2>\n\u003cp>进入本页并刷新，核对产品名称、版本、构建信息、API 信息、数据库路径、SQLite 诊断及能力清单。实际路径以本机显示为准。\u003c/p>\n\u003ch2>出现问题时记录\u003c/h2>\n\u003cp>保留版本、构建标识、发生时间和相关诊断结果，结合\u003ca href=\"#messages\">运行消息\u003c/a>说明具体操作。不要向无关人员发送密码、会话信息或完整业务数据库。\u003c/p>\n\u003cp>如果账户看不到此入口，先确认权限；不要将页面不可见等同于服务离线。\u003c/p>\n"},{"id":"faq-start","group":"help","title":"双击后没有窗口","section":"常见问题","related":["launch","faq-service"],"html":"\u003cul>\n\u003cli>确认 \u003ccode>GeoSpectrum.exe\u003c/code> 和 \u003ccode>geospectrum-backend.exe\u003c/code> 位于同一文件夹。\u003c/li>\n\u003cli>不要从压缩包内部直接运行。\u003c/li>\n\u003cli>检查 Windows 安全软件是否隔离了后端 EXE。\u003c/li>\n\u003cli>等待数秒后再试；单实例机制不会同时打开多个主窗口。\u003c/li>\n\u003c/ul>\n"},{"id":"faq-service","group":"help","title":"本地服务离线","section":"常见问题","related":["overview","about"],"html":"\u003cul>\n\u003cli>关闭主窗口后重新启动，不要单独启动后端。\u003c/li>\n\u003cli>检查后端文件是否被改名、移动或删除。\u003c/li>\n\u003cli>查看“关于与诊断”和工作台运行消息中的错误码。\u003c/li>\n\u003c/ul>\n\u003ch2>重新启动后检查\u003c/h2>\n\u003cp>等待本地服务显示“已连接”，再进入关于与诊断刷新。工作台的事件流和桌面壳固定状态文字不作为故障判断依据。若仍无法连接，保留版本、时间和错误提示后联系维护人员，不通过删除数据库重试。\u003c/p>\n"},{"id":"faq-menu","group":"help","title":"菜单灰色或找不到入口","section":"常见问题","related":["method-publish","users"],"html":"\u003cul>\n\u003cli>先发布一个有效方法并点击“设为当前”。\u003c/li>\n\u003cli>如果当前方法已暂停，进入方法管理点击恢复。\u003c/li>\n\u003cli>如果入口完全不可见，请让管理员核对账户与角色权限；当前界面的角色修改能力有限，必要时联系维护人员处理。\u003c/li>\n\u003c/ul>\n"},{"id":"faq-curves","group":"help","title":"标准曲线无法拟合或发布","section":"常见问题","related":["standard-names","quality","curves"],"html":"\u003cul>\n\u003cli>确认分析已完成并生成质控快照。\u003c/li>\n\u003cli>确认标准样品类型为“标准样”。\u003c/li>\n\u003cli>确认标准样品名称与方法标准点名称完全一致。\u003c/li>\n\u003cli>确认每个启用标准点都有有效重复均值。\u003c/li>\n\u003cli>检查被剔除重复、RSD 警告、拟合点数和残差。\u003c/li>\n\u003c/ul>\n"},{"id":"faq-report","group":"help","title":"报告为空或不能输出","section":"常见问题","related":["results","reports","exports"],"html":"\u003cul>\n\u003cli>确认分析运行状态为“已完成”。\u003c/li>\n\u003cli>确认每条分析谱线已发布曲线快照。\u003c/li>\n\u003cli>确认已执行“合并并保存”。\u003c/li>\n\u003cli>报告草稿应先预览并“确认报告”。\u003c/li>\n\u003cli>输出目录必须已经存在，并且当前 Windows 用户具有写入权限。\u003c/li>\n\u003c/ul>\n"},{"id":"faq-password","group":"help","title":"忘记密码怎么办","section":"常见问题","related":["users","backup"],"html":"\u003cp>软件没有通用默认密码。当前桌面没有可直接操作的密码重置表单，请联系维护人员制定恢复方案。不要删除 \u003ccode>%LOCALAPPDATA%\\cn.geospectrum.desktop\u003c/code> 来重新初始化，这会使本机业务数据丢失。先保留现有数据与已验证备份。\u003c/p>\n"},{"id":"faq-analysis","group":"help","title":"分析没有完成或表单报错","section":"常见问题","related":["analysis","quality","faq-evidence"],"html":"\u003col>\n\u003cli>确认至少选择一个已完成采集的样品，输入属于同一个方法版本。\u003c/li>\n\u003cli>核对慢进超时等数值，修正表单中的持久错误提示；提交失败后不会自动产生有效运行。\u003c/li>\n\u003cli>建立并锁定输入后，选中运行再点击“开始”。\u003c/li>\n\u003cli>慢进状态需要处理检查点并推进，不是等待一段时间就一定会自动完成。\u003c/li>\n\u003cli>失败时保留错误说明和运行编号，再决定修正输入、重新采集或建立新运行。\u003c/li>\n\u003c/ol>\n\u003cp>不要将旧包的现象直接当作当前包的结论。报告问题时附上“关于与诊断”的版本与构建信息。\u003c/p>\n"},{"id":"hardware-limit","group":"help","title":"真实设备与模拟器的区别","section":"常见问题","related":["devices","hardware","mercury"],"html":"\u003cp>当前界面会显示“需真实设备”或外部门禁状态。缺少现场协议和硬件验收时，不要尝试猜测串口命令、绕过安全状态机或把模拟器结果写成真实硬件结论。\u003c/p>\n\u003ch2>模拟器可以验证什么\u003c/h2>\n\u003cp>可用于熟悉界面、验证状态推进、样品数据处理和错误反馈。模拟帧与随机种子可支持重复验证，但不会证明真实串口连接、光学条件、仪器保护或测量性能已通过现场验收。\u003c/p>\n"},{"id":"faq-evidence","group":"help","title":"如何记录和反馈故障","section":"常见问题","related":["messages","about","backup"],"html":"\u003ch2>建议保留的信息\u003c/h2>\n\u003col>\n\u003cli>软件版本、构建标识和发生时间。\u003c/li>\n\u003cli>从哪个菜单进入、点击了什么、期望结果与实际结果。\u003c/li>\n\u003cli>方法及版本、任务或报告编号；必要时记下样品与 CCD。\u003c/li>\n\u003cli>完整错误码、原始错误内容及相关运行消息。\u003c/li>\n\u003cli>是否使用模拟器，是否只在某个输入或某个账户下发生。\u003c/li>\n\u003c/ol>\n\u003ch2>先做的检查\u003c/h2>\n\u003cp>确认任务已安全停止；保存消息和必要截图；检查输入及目录权限。不要先删除数据库、修改历史原件或反复覆盖输出文件。\u003c/p>\n\u003cp>对外提供资料前去除密码和无关业务数据；优先提供最小可复现步骤与诊断信息。\u003c/p>\n"},{"id":"files","group":"reference","title":"程序、数据库与备份在哪里","related":["launch","backup","settings"],"html":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>默认位置或说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>直接启动的主程序\u003c/td>\n\u003ctd>项目主文件夹中的 GeoSpectrum.exe\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>配套后端\u003c/td>\n\u003ctd>与主程序同目录的 geospectrum-backend.exe，由主程序启动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本机构建安装包\u003c/td>\n\u003ctd>app/.local/releases/0.1.0/\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正常运行数据库及相关数据\u003c/td>\n\u003ctd>%LOCALAPPDATA%\\cn.geospectrum.desktop；以关于与诊断显示为准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报告与矩阵导出\u003c/td>\n\u003ctd>对应页面指定的输出目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>在线备份\u003c/td>\n\u003ctd>备份与维护页面实际使用的目录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本手册\u003c/td>\n\u003ctd>docs/使用与说明/GeoSpectrum_使用手册.html\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>打开用户数据目录\u003c/h2>\n\u003cp>在资源管理器地址栏输入 \u003ccode>%LOCALAPPDATA%\\cn.geospectrum.desktop\u003c/code> 并回车。只查看和定位即可，不要在程序运行时移动数据库及其日志文件。\u003c/p>\n\u003ch2>升级或复制程序\u003c/h2>\n\u003cp>主程序和后端必须来自同一次构建，并成对放置。移动程序不会自动搬迁用户数据库。便携演示版通过自己的启动脚本使用 demo-data，不能把演示数据库误认为正常账户的业务库。\u003c/p>\n"},{"id":"formats","group":"reference","title":"旧文件与输出格式速查","related":["migrate-methods","migrate-spectra","migrate-results","exports"],"html":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>文件类型\u003c/th>\n\u003cth>当前入口\u003c/th>\n\u003cth>处理方式\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DIRECT.MTD / DIRECT.CFG / DIRECT.OPT\u003c/td>\n\u003ctd>旧方法与配置迁移\u003c/td>\n\u003ctd>只读暂存、校验、提交\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CDT / CMT / EDT / WDT\u003c/td>\n\u003ctd>旧谱数据迁移\u003c/td>\n\u003ctd>保留原件和来源指纹\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DAT / PDT\u003c/td>\n\u003ctd>旧结果迁移\u003c/td>\n\u003ctd>保留结果与方法匹配诊断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SAM\u003c/td>\n\u003ctd>样号与样品队列\u003c/td>\n\u003ctd>导入或导出样品队列\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CSV / TXT / Excel\u003c/td>\n\u003ctd>报告或矩阵输出\u003c/td>\n\u003ctd>按所选结果和范围导出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PDF\u003c/td>\n\u003ctd>方法、谱图、曲线或报告\u003c/td>\n\u003ctd>按对应预览/页面设置生成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LOG\u003c/td>\n\u003ctd>运行消息\u003c/td>\n\u003ctd>保存操作与排错信息\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>迁移旧 Access 类格式不会回写原件，也不生成可供旧版回读的 Access 文件。不要根据相似扩展名推断支持范围。\u003c/p>\n"},{"id":"profiles","group":"reference","title":"计算档案与常用术语","related":["analysis","standard-names","backup","method-publish"],"html":"\u003ch2>计算档案\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>modern_v1：\u003c/strong>现代计算口径；高斯模式保存峰高、中心、Sigma 和面积，并以面积参与定量。\u003c/li>\n\u003cli>\u003cstrong>legacy_2_0_2：\u003c/strong>旧版兼容口径，用于复现旧版相关计算行为。\u003c/li>\n\u003c/ul>\n\u003cp>它们不是可以随意互换的显示选项。重算时明确选择，报告应保留所用档案，比较结果时同时核对档案和方法版本。\u003c/p>\n\u003ch2>常用术语\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>使用时的含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>草稿 / 发布版本\u003c/td>\n\u003ctd>可编辑准备状态 / 后续数据引用的不可变版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前方法\u003c/td>\n\u003ctd>当前运行选用的方法；不一定等于正在浏览的列表项\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CCD / 点位 / 波长\u003c/td>\n\u003ctd>检测阵列、采样位置与经校准对应的波长坐标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>燃烧帧 / 暗帧\u003c/td>\n\u003ctd>采集阶段的原始帧类型，查看与处理时需区分\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>平均谱 / 全时区间\u003c/td>\n\u003ctd>平均结果 / 保留逐帧过程的数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标准点 / 标准样\u003c/td>\n\u003ctd>方法中已知数值点 / 与之名称对应的实际采集样品\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RSD\u003c/td>\n\u003ctd>相对标准偏差，结合方法阈值和有效重复次数检查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>快照\u003c/td>\n\u003ctd>某次质控、曲线、合并或报告结果的固定记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SHA-256\u003c/td>\n\u003ctd>文件或数据内容指纹，用于核对来源与完整性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恢复演练\u003c/td>\n\u003ctd>在隔离副本中验证备份，不等于切换当前数据库\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"id":"protection","group":"reference","title":"数据保护与使用边界","related":["hardware-limit","backup","faq-evidence"],"html":"\u003cul>\n\u003cli>前后端 EXE 必须成对保留，升级时也必须使用同一次构建的两个文件。\u003c/li>\n\u003cli>旧版 MTD、CFG、OPT、CDT、CMT、EDT、WDT、DAT、PDT 和 SAM 原件保持只读，不要用新版程序覆盖。\u003c/li>\n\u003cli>方法发布版本、校准版本、质控快照、曲线快照和报告版本都是可追溯记录，不要用人工修改数据库代替业务操作。\u003c/li>\n\u003cli>使用“备份与维护”中的在线备份、校验和恢复演练，不要把手工复制数据库当作完整备份流程。\u003c/li>\n\u003cli>出现错误时先记录错误码、任务编号、时间和运行消息，再决定重试、恢复或重新采集。\u003c/li>\n\u003c/ul>\n\u003ch2>本手册的使用边界\u003c/h2>\n\u003cp>手册中的模拟操作不代替真实设备说明、现场安全操作规程或正式发布验收。遇到界面与文档不同，先核对版本并保留提示；不要为了照着文档执行而绕过产品校验。\u003c/p>\n"}],"version":"0.1.0","date":"2026-09-05"};
const topics=DATA.topics, groups=DATA.groups, byId=new Map(topics.map(t=>[t.id,t]));
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plain=html=>{const d=document.createElement('div');d.innerHTML=html;return(d.textContent||'').replace(/\s+/g,' ').trim()};
const searchable=topics.map(t=>({...t,text:plain(t.html)}));
let position=0, maximum=0, fontSize=16, current='welcome', expanded=false;
history.replaceState({manual:true,position:0},'',location.href);
const groupName=id=>groups.find(g=>g.id===id).title;
const topicLink=t=>`<a class="tree-link" href="#${t.id}" data-topic="${t.id}">${escapeHtml(t.title)}</a>`;
function buildTree(){
 $('toc').innerHTML=groups.map((g,i)=>{
  const list=topics.filter(t=>t.group===g.id);let children='',section='';
  for(const t of list){
   if((t.section||'')!==section){if(section)children+='</div></details>';section=t.section||'';if(section)children+=`<details class="tree-subgroup"><summary>${escapeHtml(section)}</summary><div class="tree-children">`;}
   children+=topicLink(t);
  }
  if(section)children+='</div></details>';
  return `<details class="tree-group" data-group="${g.id}"${g.id==='start'?' open':''}><summary><span class="group-number">${String(i+1).padStart(2,'0')}</span>${escapeHtml(g.title)}</summary><div class="tree-children">${children}</div></details>`;
 }).join('');
 $('topic-count').textContent=`${groups.length} 章 · ${topics.length} 个主题`;
}
function showTab(search){
 $('toc').hidden=search;$('search-results').hidden=!search;
 for(const [id,active] of [['toc-tab',!search],['search-tab',search]]){$(id).setAttribute('aria-selected',String(active));$(id).tabIndex=active?0:-1;}
}
function route(){let value;try{value=decodeURIComponent(location.hash.slice(1))}catch{value='invalid'};const [id,anchor]=value.split('~');return{id:id||'welcome',anchor};}
function navigate(id){
 if(location.hash==='#'+id){render();return;}
 position++;maximum=position;history.pushState({manual:true,position},'','#'+id);render();
}
function closeMenu(){$('sidebar').classList.remove('open');$('menu-toggle').setAttribute('aria-expanded','false');}
function render(){
 const r=route();let t=byId.get(r.id);$('not-found').hidden=!!t;if(!t)t=byId.get('welcome');current=t.id;
 document.title=t.title+' — GeoSpectrum 使用手册';
 $('breadcrumbs').innerHTML=`<a href="#welcome">使用手册</a><span>›</span><a href="#${topics.find(x=>x.group===t.group).id}">${escapeHtml(groupName(t.group))}</a>${t.section?`<span>›</span><span>${escapeHtml(t.section)}</span>`:''}<span>›</span><span class="current">${escapeHtml(t.title)}</span>`;
 $('article').className=t.id==='welcome'?'welcome':'';
 const body=(!/<h[23][ >]/.test(t.html)&&t.id!=='welcome'?'<h2>操作说明</h2>':'')+t.html;
 $('article').innerHTML=`<header class="article-header"><div class="eyebrow">${escapeHtml(groupName(t.group))} / GEOSPECTRUM GUIDE</div><h1 id="topic-title">${escapeHtml(t.title)}</h1>${t.lead?`<p class="lead">${escapeHtml(t.lead)}</p>`:''}${t.entry?`<div class="entry"><strong>软件入口</strong>${escapeHtml(t.entry)}</div>`:''}</header><div class="article-body">${body}</div>`;
 const headings=[...$('article').querySelectorAll('.article-body h2,.article-body h3')];
 headings.forEach((h,i)=>h.id='section-'+i);
 $('outline').innerHTML='<strong>本页内容</strong>'+headings.map((h,i)=>`<a href="#${t.id}~section-${i}">${escapeHtml(h.textContent)}</a>`).join('');
 $('outline').hidden=!headings.length;
 $('related').innerHTML='<h2>继续阅读</h2><div class="related-links">'+(t.related||[]).map(id=>`<a href="#${id}">${escapeHtml(byId.get(id).title)} <span aria-hidden="true">↗</span></a>`).join('')+'</div>';
 $('related').hidden=!(t.related||[]).length;
 const index=topics.indexOf(t),prev=topics[index-1],next=topics[index+1];
 $('page-nav').innerHTML=(prev?`<a href="#${prev.id}"><span>← 上一页</span><strong>${escapeHtml(prev.title)}</strong></a>`:'<span></span>')+(next?`<a href="#${next.id}"><span>下一页 →</span><strong>${escapeHtml(next.title)}</strong></a>`:'<span></span>');
 document.querySelectorAll('.tree-link').forEach(a=>a.removeAttribute('aria-current'));
 const selected=document.querySelector(`.tree-link[data-topic="${t.id}"]`);
 if(selected){selected.setAttribute('aria-current','page');let ancestor=selected.parentElement;while(ancestor&&ancestor!==$('toc')){if(ancestor.tagName==='DETAILS')ancestor.open=true;ancestor=ancestor.parentElement;}}
 $('back').disabled=position<=0;$('forward').disabled=position>=maximum;
 $('main').scrollTop=0;closeMenu();
 if(r.anchor){const heading=headings.find(h=>h.id===r.anchor);if(heading)requestAnimationFrame(()=>heading.scrollIntoView({block:'start'}));}
}
function search(){
 const q=$('search').value.trim().toLocaleLowerCase();$('clear-search').hidden=!q;
 if(!q){$('result-list').innerHTML='';$('search-status').textContent='输入关键词，搜索标题和正文。';showTab(false);return;}
 showTab(true);const words=q.split(/\s+/).filter(Boolean);
 const results=searchable.map(t=>{const title=t.title.toLocaleLowerCase(),body=t.text.toLocaleLowerCase();return{t,score:words.every(w=>(title+' '+body).includes(w))?words.reduce((s,w)=>s+(title.includes(w)?10:1),0):0}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
 $('search-status').textContent=`找到 ${results.length} 个主题`;
 $('result-list').innerHTML='';
 if(!results.length){const p=document.createElement('p');p.className='empty';p.textContent='没有匹配主题。试试更短的关键词，例如“方法”“曲线”或“备份”。';$('result-list').append(p);return;}
 for(const {t} of results){const a=document.createElement('a');a.href='#'+t.id;a.className='search-result';const title=document.createElement('strong');title.textContent=t.title;const group=document.createElement('small');group.textContent=groupName(t.group)+(t.section?' / '+t.section:'');const snippet=document.createElement('p');const start=Math.max(0,t.text.toLocaleLowerCase().indexOf(words[0])-22);snippet.textContent=(start?'…':'')+t.text.slice(start,start+95)+(start+95<t.text.length?'…':'');a.append(title,group,snippet);$('result-list').append(a);}
}
document.addEventListener('click',event=>{
 const link=event.target.closest('a[href^="#"]');if(!link||link.id==='skip'||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
 event.preventDefault();navigate(link.getAttribute('href').slice(1));
});
window.addEventListener('popstate',()=>{position=history.state?.manual?history.state.position:0;render()});
window.addEventListener('hashchange',()=>{if(!history.state?.manual){position++;maximum=position;history.replaceState({manual:true,position},'',location.href);}render()});
$('back').onclick=()=>history.back();$('forward').onclick=()=>history.forward();$('home').onclick=()=>navigate('welcome');$('print').onclick=()=>window.print();
$('font-smaller').onclick=()=>{fontSize=Math.max(14,fontSize-1);document.documentElement.style.setProperty('--article-size',fontSize+'px')};
$('font-larger').onclick=()=>{fontSize=Math.min(22,fontSize+1);document.documentElement.style.setProperty('--article-size',fontSize+'px')};
$('search').addEventListener('input',search);$('clear-search').onclick=()=>{$('search').value='';search();$('search').focus()};
$('toc-tab').onclick=()=>showTab(false);$('search-tab').onclick=()=>{showTab(true);$('search').focus()};
document.querySelector('.tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const toSearch=event.key==='End'||(event.key!=='Home'&&$('toc-tab').getAttribute('aria-selected')==='true');showTab(toSearch);$(toSearch?'search-tab':'toc-tab').focus()});
$('expand-all').onclick=()=>{expanded=!expanded;document.querySelectorAll('#toc details').forEach(d=>d.open=expanded);$('expand-all').textContent=expanded?'全部收起':'全部展开'};
$('menu-toggle').onclick=()=>{const open=$('sidebar').classList.toggle('open');$('menu-toggle').setAttribute('aria-expanded',String(open))};
$('main').addEventListener('click',closeMenu);$('skip').onclick=event=>{event.preventDefault();$('main').focus()};
document.addEventListener('keydown',event=>{if(event.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){event.preventDefault();if(innerWidth<=760){$('sidebar').classList.add('open');$('menu-toggle').setAttribute('aria-expanded','true')}$('search').focus()}if(event.key==='Escape'){closeMenu()}});
buildTree();render();
</script>
</body>
</html>
